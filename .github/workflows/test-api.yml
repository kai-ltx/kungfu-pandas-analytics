name: KungFu Pandas Data Sync

on:
  workflow_dispatch:

  schedule:
    # Candidate UTC hours covering 17:00-02:59 Europe/London in both GMT and
    # BST. The timezone check below skips hours outside that window.
    # Minute 7 avoids the top-of-hour load where GitHub delays/drops runs.
    - cron: '7 0,1,2,16,17,18,19,20,21,22,23 * * *'

concurrency:
  group: kungfu-pandas-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check UK playing-hours schedule
        id: timecheck
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          hour = datetime.now(
              ZoneInfo("Europe/London")
          ).hour

          allowed = {17, 18, 19, 20, 21, 22, 23, 0, 1, 2}

          run = (
              os.environ["EVENT_NAME"] == "workflow_dispatch"
              or hour in allowed
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={str(run).lower()}\n")

          print(f"London hour: {hour}")
          print(f"Run importer: {run}")
          PY

      - name: Checkout repository
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: pip install -r requirements-dev.txt

      - name: Run data-integrity tests
        if: steps.timecheck.outputs.run == 'true'
        run: python -m pytest -q

      - name: Sync all three clubs
        if: steps.timecheck.outputs.run == 'true'
        env:
          GOOGLE_WEBHOOK_URL: ${{ secrets.GOOGLE_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: python sync_to_sheets.py
