name: KungFu Pandas Data Sync

on:
  workflow_dispatch:

  schedule:
    # Evening imports (UK time)
    - cron: '0 17,19,21,23 * * *'
      timezone: 'Europe/London'

    # Overnight imports (UK time)
    - cron: '0 1,2 * * *'
      timezone: 'Europe/London'

concurrency:
  group: kungfu-pandas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fc-clubs-api requests

      - name: Import FC27 statistics
        env:
          GOOGLE_WEBHOOK_URL: ${{ secrets.GOOGLE_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: python sync_to_sheets.py
