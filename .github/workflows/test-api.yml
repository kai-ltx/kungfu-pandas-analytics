name: KungFu Pandas Data Sync

on:
  workflow_dispatch:

  schedule:
    # One schedule per playing hour, in UK time, so GMT and BST stay on the
    # same clock. Minute 7 avoids the top-of-hour load where GitHub delays
    # or drops runs. A run that starts late still imports.
    - cron: '7 17 * * *'
      timezone: Europe/London
    - cron: '7 18 * * *'
      timezone: Europe/London
    - cron: '7 19 * * *'
      timezone: Europe/London
    - cron: '7 20 * * *'
      timezone: Europe/London
    - cron: '7 21 * * *'
      timezone: Europe/London
    - cron: '7 22 * * *'
      timezone: Europe/London
    - cron: '7 23 * * *'
      timezone: Europe/London
    - cron: '7 0 * * *'
      timezone: Europe/London
    - cron: '7 1 * * *'
      timezone: Europe/London
    - cron: '7 2 * * *'
      timezone: Europe/London

concurrency:
  group: kungfu-pandas-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run data-integrity tests
        run: python -m pytest -q

      - name: Sync all three clubs
        env:
          GOOGLE_WEBHOOK_URL: ${{ secrets.GOOGLE_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: python sync_to_sheets.py
