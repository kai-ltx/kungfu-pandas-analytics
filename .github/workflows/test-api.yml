name: KungFu Pandas Data Sync

on:
  workflow_dispatch:

  schedule:
    # Spare clock only. GitHub starts scheduled work when Actions is quiet and
    # drops some of it, so a pile of crons arrived the next morning instead of
    # during the match. sync-clock/ dispatches this workflow every 30 minutes
    # from 17:00 to 02:59 UK time, and a dispatch starts straight away.
    # https://docs.github.com/en/actions/how-tos/troubleshoot-workflows
    - cron: '13 17-23,0-2 * * *'
      timezone: Europe/London

concurrency:
  group: kungfu-pandas-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Skip a scheduled run delivered outside playing hours
        id: gate
        run: |
          python3 - << 'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from sync_window import should_sync
          hour = datetime.now(ZoneInfo("Europe/London")).hour
          run = should_sync(os.environ["EVENT_NAME"], hour)
          print(f"event={os.environ['EVENT_NAME']} london_hour={hour} run={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write("run=%s\n" % ("true" if run else "false"))
          PY
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements-dev.txt

      - name: Run data-integrity tests
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q

      - name: Sync all three clubs
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_WEBHOOK_URL: ${{ secrets.GOOGLE_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: python sync_to_sheets.py
