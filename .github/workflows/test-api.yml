name: KungFu Pandas API Test

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FC27 API library
        run: pip install fc-clubs-api

      - name: Test EA connection
        run: python test_connection.py
