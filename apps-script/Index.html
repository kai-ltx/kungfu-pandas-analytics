<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PandaMetrics | The Panda Den</title>
  <style>
    :root {
      --bg: #09130f;
      --surface: #14251d;
      --surface2: #1b3227;
      --border: #30503d;
      --green: #baff83;
      --green2: #62d69e;
      --text: #f0f8f1;
      --muted: #a7bcae;
      --gold: #ffd76a;
      --red: #ff9685;
      --blue: #7cc8ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, Arial, sans-serif; }
    header { background: linear-gradient(125deg, #204b32, #10231a); padding: 22px 16px 10px; border-bottom: 1px solid var(--border); }
    .container, main { max-width: 1200px; margin: auto; }
    main { padding: 16px; }
    h1 { font-size: clamp(28px, 6vw, 46px); margin: 6px 0; }
    h2 { margin: 18px 0 10px; font-size: 22px; }
    h3 { margin: 0 0 10px; font-size: 17px; }
    p { color: var(--muted); line-height: 1.55; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: 2px; }
    .header-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .muted { color: var(--muted); }
    .small, small { font-size: 13px; }
    .hidden { display: none !important; }

    nav, .buttons, .filters { display: flex; gap: 8px; margin: 12px 0; }
    nav, .buttons.scroll { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    nav::-webkit-scrollbar, .buttons.scroll::-webkit-scrollbar { display: none; }
    .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .filters.inline { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    button, select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 11px; padding: 10px 13px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    select { width: 100%; }
    button.active { background: var(--green); color: #102118; font-weight: 800; }
    button:hover, select:hover { border-color: var(--green2); }
    button:disabled { opacity: .6; cursor: wait; }
    button.link, .name-link { background: none; border: 0; padding: 0; color: var(--green); font-weight: 700; }
    .name-link { color: var(--text); font-size: 15px; text-align: left; }
    label { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 6px; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .panel.empty { color: var(--muted); }
    details summary { cursor: pointer; color: var(--muted); margin: 8px 0; }
    details.panel summary { color: var(--text); margin: 0; }
    .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
    .grid > .panel { margin-bottom: 0; }
    .grid.stats { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 14px; }
    .grid.minis { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .stat { font-size: 30px; font-weight: 900; color: var(--green); }
    .small-stat { font-size: 18px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
    .chip.grp.ATT { border-color: #ff9685; color: #ffc2b8; }
    .chip.grp.MID { border-color: #62d69e; color: #b6f0d0; }
    .chip.grp.DEF { border-color: #7cc8ff; color: #c4e6ff; }
    .chip.good { border-color: var(--green2); color: var(--green); }
    .chip.bad { border-color: var(--red); color: var(--red); }
    .chip.cov.ok { color: var(--green2); }
    .chip.cov.warn { color: var(--gold); border-color: var(--gold); }
    .chip.cov.bad { color: var(--red); border-color: var(--red); }
    .badge { font-size: 11px; padding: 2px 7px; border-radius: 6px; vertical-align: middle; font-weight: 700; }
    .badge.exp { background: #4d2a20; color: var(--red); }
    .badge.med { background: #4a4020; color: var(--gold); }
    .unit { font-size: 12px; color: var(--muted); font-weight: 400; }

    .form { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 800; background: var(--surface2); }
    .form.win { background: var(--green2); color: #0b1a12; }
    .form.loss { background: var(--red); color: #2a0f0a; }
    .form.draw { background: var(--gold); color: #2a220a; }
    .forms { display: flex; gap: 4px; margin-top: 8px; }
    .record { font-size: 20px; }
    .match-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .match-row:last-child { border-bottom: 0; }
    .grow { flex: 1 1 160px; min-width: 0; }

    .bamboo { background: linear-gradient(135deg, #1f4a2f, #14251d); }
    .bamboo h2 { margin-top: 6px; }
    .mini-awards { display: grid; gap: 10px; grid-template-columns: 1fr; }
    .mini-award { background: rgba(0,0,0,.2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .mini-award.shame { border-color: #6b3a32; }
    .mini-award .name { font-size: 18px; font-weight: 800; margin: 4px 0; }

    .rank-row { display: grid; grid-template-columns: 32px 1fr auto; grid-template-areas: "n name value" "n bar bar"; gap: 6px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .rank-row:last-child { border-bottom: 0; }
    .rank-row .rank-number { grid-area: n; font-weight: 900; color: var(--green); font-size: 18px; text-align: center; }
    .rank-row .grow { grid-area: name; }
    .rank-row .score-col { grid-area: bar; }
    .rank-row .value { grid-area: value; font-weight: 900; font-size: 18px; }
    .rank-name { font-weight: 700; }
    .bar { height: 7px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
    .bar .fill { height: 100%; background: linear-gradient(90deg, var(--green2), var(--green)); }
    .prov { padding: 4px 0; font-size: 13px; }
    .formula code { display: block; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
    table.weights { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.weights th { text-align: left; padding: 6px 8px 6px 0; color: var(--green); vertical-align: top; }
    table.weights td { padding: 6px 0; color: var(--muted); }

    .chart { width: 100%; height: auto; display: block; }
    .chart .axis { fill: var(--muted); font-size: 11px; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }
    .mini .mini-head { display: flex; justify-content: space-between; }
    .mover { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; padding: 6px 0; }
    .mover .up { color: var(--green); font-weight: 800; }
    .mover .down { color: var(--red); font-weight: 800; }

    .profile { background: linear-gradient(135deg, #285c3c, #14251d); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
    .profile h2 { margin: 8px 0 4px; }
    .profile-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .profile-rating { font-size: 48px; font-weight: 900; color: var(--gold); line-height: 1; }
    .right { text-align: right; }
    .note { background: var(--surface2); border-radius: 12px; padding: 12px; margin-bottom: 10px; line-height: 1.5; }
    .direction-row { margin-bottom: 12px; }
    .direction-label { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-size: 13px; margin-bottom: 4px; }
    .direction-label span { color: var(--muted); }
    .metric-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .metric-card { background: var(--surface2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .metric-card.provisional { opacity: .7; }
    .metric-label { font-size: 13px; color: var(--muted); }
    .metric-value { font-size: 22px; font-weight: 900; }
    .metric-detail, .peer { font-size: 12px; color: var(--muted); }
    .peer { color: var(--blue); }

    .grid.cards { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .card { background: linear-gradient(160deg, #3b6b2f, #14251d 70%); border: 1px solid var(--gold); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .card-top { display: flex; justify-content: space-between; align-items: baseline; }
    .card-score { font-size: 40px; font-weight: 900; color: var(--gold); }
    .card-pos { font-weight: 800; color: var(--gold); }
    .card-name { font-size: 20px; font-weight: 800; }
    .card-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; font-size: 11px; color: var(--muted); }
    .card-stats b { display: block; font-size: 16px; color: var(--text); }
    .finder-row { display: grid; grid-template-columns: 80px 1fr 28px; gap: 6px; align-items: center; font-size: 13px; margin-top: 4px; }
    .finder-row .muted { grid-column: 1 / -1; }

    .award-grid { display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 20px; }
    .award { background: linear-gradient(160deg, #2d5a37, #14251d); border: 1px solid var(--gold); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .award.shame { background: linear-gradient(160deg, #4a2620, #14251d); border-color: var(--red); }
    .award-title { font-weight: 800; color: var(--gold); }
    .award.shame .award-title { color: var(--red); }
    .award-player { font-size: 20px; font-weight: 900; }
    .award-number { font-size: 16px; color: var(--green); font-weight: 800; }
    .award-description { font-size: 13px; color: var(--muted); flex: 1; }
    .award-footer { font-size: 12px; color: var(--muted); border-top: 1px solid rgba(255,255,255,.08); padding-top: 6px; min-height: 2.6em; }
    #loading { padding: 40px 0; text-align: center; color: var(--muted); }

    @media (min-width: 700px) {
      header { padding: 28px 20px 12px; }
      main { padding: 20px; }
      .filters { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      .grid.two { grid-template-columns: 1fr 1fr; }
      .grid.stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .mini-awards { grid-template-columns: repeat(3, 1fr); }
      .rank-row { grid-template-columns: 40px minmax(160px, 1fr) minmax(140px, 220px) 60px; grid-template-areas: "n name bar value"; }
      .award-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); grid-auto-rows: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="eyebrow">PANDAMETRICS V4</div>
      <div class="header-row">
        <h1>🐼 The Panda Den</h1>
        <div>
          <button id="refresh" title="Reload the latest synced data">🔄 Refresh stats</button>
          <div id="updated" class="muted small"></div>
        </div>
      </div>
      <p class="small">Official league and playoff stats for KungFu Pandas, Bamboo Shoots and Torquay. Synced automatically every evening.</p>
      <nav id="nav" aria-label="Sections"></nav>
    </div>
  </header>
  <main>
    <div id="loading">Loading PandaMetrics…</div>
    <div id="app" class="hidden">
      <div id="filters" class="filters"></div>
      <section id="overview"></section>
      <section id="rankings" class="hidden"></section>
      <section id="evolution" class="hidden"></section>
      <section id="lab" class="hidden"></section>
      <section id="squad" class="hidden"></section>
      <section id="awards" class="hidden"></section>
    </div>
  </main>
  <?!= include_("ClientLib") ?>
</body>
</html>
