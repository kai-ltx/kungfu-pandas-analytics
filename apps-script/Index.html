<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PandaMetrics V3.2</title>

  <style>
    :root {
      --bg: #09130f;
      --surface: #14251d;
      --surface2: #1b3227;
      --border: #30503d;
      --green: #baff83;
      --green2: #62d69e;
      --text: #f0f8f1;
      --muted: #a7bcae;
      --gold: #ffd76a;
      --red: #ff9685;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    header {
      background: linear-gradient(125deg, #204b32, #10231a);
      padding: 28px 20px;
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 48px);
      margin: 8px 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    h3 {
      margin: 0 0 10px;
    }

    p {
      color: var(--muted);
      line-height: 1.55;
    }

    .eyebrow {
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .filters,
    nav,
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    button,
    select {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    button.active {
      background: var(--green);
      color: #102118;
      font-weight: 800;
    }

    button:hover,
    select:hover {
      border-color: var(--green2);
    }

    label {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin: 16px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .stat {
      color: var(--green);
      font-size: 34px;
      font-weight: 900;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .podium {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .podium-card {
      background: linear-gradient(145deg, #294936, #14251d);
      border: 1px solid #68865b;
      border-radius: 18px;
      padding: 20px 12px;
      text-align: center;
      min-width: 0;
    }

    .podium-card.first {
      border-color: var(--gold);
      background: linear-gradient(145deg, #54472a, #243525);
    }

    .medal {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .podium-name {
      font-weight: 850;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .podium-score {
      font-size: 30px;
      font-weight: 900;
      color: var(--gold);
      margin: 12px 0;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 42px minmax(110px, 1.5fr)
                             minmax(70px, 2fr) 90px;
      align-items: center;
      gap: 12px;
      padding: 14px 8px;
      border-bottom: 1px solid var(--border);
    }

    .rank-number {
      color: var(--gold);
      font-size: 20px;
      font-weight: 900;
    }

    .rank-name {
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .bar {
      height: 12px;
      background: #304638;
      border-radius: 20px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #49c99b, #baff83);
      border-radius: 20px;
    }

    .value {
      text-align: right;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .metric-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .metric-value {
      font-size: 27px;
      font-weight: 900;
      color: var(--green);
      margin: 8px 0;
    }

    .metric-label {
      font-size: 13px;
      color: var(--muted);
    }

    .metric-detail {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.4;
    }

    .award-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .award {
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #28432e, #14251d);
      border: 1px solid #6b8b5c;
      border-radius: 18px;
      padding: 20px;
      min-height: 290px;
    }

    .award.shame {
      background: linear-gradient(145deg, #442825, #211c1b);
      border-color: #9c514b;
    }

    .award-title {
      font-size: 18px;
      font-weight: 850;
      min-height: 48px;
    }

    .award-player {
      font-size: 23px;
      font-weight: 900;
      color: var(--gold);
      margin: 16px 0 6px;
      overflow-wrap: anywhere;
    }

    .award.shame .award-player {
      color: var(--red);
    }

    .award-number {
      font-size: 30px;
      font-weight: 900;
      color: var(--green);
      margin: 8px 0;
    }

    .award.shame .award-number {
      color: var(--red);
    }

    .award-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .award-footer {
      margin-top: auto;
      padding-top: 14px;
      font-size: 13px;
      color: #c8dfcd;
    }

    .award.shame .award-footer {
      color: #ffd0c6;
    }

    .profile {
      background: linear-gradient(145deg, #294936, #14251d);
      border: 1px solid #779365;
      border-radius: 18px;
      padding: 22px;
    }

    .profile-rating {
      font-size: 48px;
      color: var(--gold);
      font-weight: 900;
    }

    .direction-row {
      margin: 18px 0;
    }

    .direction-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .note {
      background: #20372a;
      border-left: 4px solid var(--green2);
      padding: 14px;
      border-radius: 9px;
      margin: 12px 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .warning {
      background: #352722;
      border-left-color: var(--red);
    }

    .hidden {
      display: none !important;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    @media(max-width:650px) {
      main {
        padding: 12px;
      }

      .panel {
        padding: 14px;
      }

      .podium {
        gap: 6px;
      }

      .podium-card {
        padding: 14px 6px;
      }

      .podium-name {
        font-size: 13px;
      }

      .podium-score {
        font-size: 23px;
      }

      .rank-row {
        grid-template-columns: 26px minmax(95px, 1.5fr)
                               minmax(45px, 1fr) 70px;
        gap: 6px;
      }

      .rank-name {
        font-size: 13px;
      }

      .value {
        font-size: 13px;
      }

      .award {
        min-height: 260px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <div class="eyebrow">
      🐼 KUNGFU PANDAS • BAMBOO SHOOTS • TORQUAY
    </div>

    <h1>
      PandaMetrics
      <span style="color:#baff83">V3.2</span>
    </h1>

    <p>The stats don't lie. The pandas might.</p>
  </div>
</header>

<main>

  <div id="loading" class="panel">
    🐼 Loading the squad...
  </div>

  <div id="app" class="hidden">

    <div class="filters">
      <label>
        Club
        <select id="club">
          <option value="all">All Clubs</option>
          <option value="454058">KungFu Pandas</option>
          <option value="451080">Bamboo Shoots</option>
          <option value="413965">Torquay</option>
        </select>
      </label>

      <label>
        Period
        <select id="period">
          <option value="all">All Recorded</option>
          <option value="5">Last 5 Matches</option>
          <option value="10">Last 10 Matches</option>
          <option value="20">Last 20 Matches</option>
        </select>
      </label>

      <label>
        Minimum Matches
        <select id="minimum">
          <option value="3">3 Matches</option>
          <option value="1">1 Match</option>
          <option value="5">5 Matches</option>
          <option value="10">10 Matches</option>
        </select>
      </label>
    </div>

    <nav>
      <button class="active" data-view="rankings">
        🏆 Rankings
      </button>

      <button data-view="lab">
        🔬 Panda Lab
      </button>

      <button data-view="players">
        🃏 Panda XI
      </button>

      <button data-view="awards">
        🌟 Hall of Pandas
      </button>

      <button data-view="shame">
        💀 Wall of Shame
      </button>
    </nav>

    <div id="summary" class="grid"></div>

    <section id="rankings"></section>
    <section id="lab" class="hidden"></section>
    <section id="players" class="hidden"></section>
    <section id="awards" class="hidden"></section>
    <section id="shame" class="hidden"></section>

  </div>

</main>

<script>
"use strict";

// ==========================================
// DATA CONFIGURATION
// ==========================================

const METRICS = {
  goals: {
    label: "Goals per match",
    field: "goals",
    mode: "rate",
    higher: true
  },
  assists: {
    label: "Assists per match",
    field: "assists",
    mode: "rate",
    higher: true
  },
  forward: {
    label: "Forward passes per match",
    field: "passesCompletedForward",
    mode: "rate",
    higher: true
  },
  forwardAccuracy: {
    label: "Forward-pass accuracy",
    mode: "forwardAccuracy",
    higher: true,
    minAttempts: 10
  },
  passing: {
    label: "Overall passing accuracy",
    mode: "passingAccuracy",
    higher: true,
    minAttempts: 15
  },
  backward: {
    label: "Backward-pass share",
    mode: "backwardShare",
    higher: false,
    minAttempts: 15
  },
  interceptions: {
    label: "Interceptions per match",
    field: "interceptions",
    mode: "rate",
    higher: true
  },
  tackles: {
    label: "Tackles won per match",
    field: "tacklesWon",
    mode: "rate",
    higher: true
  },
  recoveries: {
    label: "Possession recovered per match",
    mode: "recoveries",
    higher: true
  },
  losses: {
    label: "Possession lost per match",
    mode: "losses",
    higher: false
  },
  danger: {
    label: "Defensive-third losses per match",
    field: "possessionLostDefensiveThird",
    mode: "rate",
    higher: false
  },
  positioning: {
    label: "Positioning errors per match",
    field: "outOfPosition",
    mode: "rate",
    higher: false
  },
  decisions: {
    label: "Best decisions per match",
    field: "feedbackBestOptionTaken",
    mode: "rate",
    higher: true
  },
  missed: {
    label: "Missed passing options per match",
    field: "feedbackShouldHavePassedElsewhere",
    mode: "rate",
    higher: false
  },
  shooting: {
    label: "Shooting accuracy",
    mode: "shootingAccuracy",
    higher: true,
    minAttempts: 5
  },
  conversion: {
    label: "Shot conversion",
    mode: "conversion",
    higher: true,
    minAttempts: 5
  }
};

const CATEGORIES = [
  {
    name: "🎯 Passing",
    metrics: ["forward", "forwardAccuracy", "passing", "backward"]
  },
  {
    name: "⚽ Attacking",
    metrics: ["goals", "assists", "shooting", "conversion"]
  },
  {
    name: "🛡️ Defending",
    metrics: ["interceptions", "tackles", "recoveries"]
  },
  {
    name: "🔄 Possession",
    metrics: ["recoveries", "losses", "danger"]
  },
  {
    name: "🧠 Football IQ",
    metrics: ["decisions", "missed", "positioning"]
  }
];

const POSITIVE_AWARDS = [
  ["👑 Golden Panda", "rating", "Highest average EA match rating."],
  ["🎯 Goal Machine", "goals", "Most goals per match."],
  ["🚀 Forward Thinker", "forward", "Most completed forward passes per match."],
  ["🛡️ Kung Fu Master", "interceptions", "Most interceptions per match."],
  ["🧤 Ball Magnet", "recoveries", "Most possession recoveries per match."],
  ["🧠 Professor Panda", "decisions", "Most EA best-option decisions per match."]
];

const NEGATIVE_AWARDS = [
  ["🦀 Crab King", "backward",
   "Try spotting safe forward options before recycling possession.", "high"],
  ["🧈 Butterfingers", "losses",
   "Release the ball earlier when under pressure.", "high"],
  ["🚨 Danger Panda", "danger",
   "Avoid risky possession losses near your own goal.", "high"],
  ["🗺️ Lost Panda", "positioning",
   "Focus on maintaining your defensive or attacking position.", "high"],
  ["🙈 Tunnel Vision", "missed",
   "Scan the pitch before receiving possession.", "high"],
  ["🎯 Stormtrooper", "shooting",
   "Improve shot selection and shooting angles.", "low"]
];

let raw = null;
let currentView = "rankings";
let currentCategory = 0;
let selectedPlayer = null;

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function num(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function sum(player, field) {
  return player.totals[field] || 0;
}

function has(player, field) {
  return player.available.has(field);
}

function ratio(a, b) {
  return b > 0 ? a / b * 100 : null;
}

// ==========================================
// FILTERED DATA
// ==========================================

function filteredMatches() {
  const club = $("club").value;
  const period = $("period").value;

  let matches = raw.matches
    .filter(m => club === "all" || m.clubId === club)
    .sort((a, b) =>
      String(b.timestamp).localeCompare(String(a.timestamp))
    );

  if (period !== "all") {
    matches = matches.slice(0, Number(period));
  }

  return matches;
}

function filteredRecords() {
  const keys = new Set(
    filteredMatches().map(m => m.clubId + "|" + m.matchId)
  );

  return raw.records.filter(r =>
    keys.has(r.clubId + "|" + r.matchId)
  );
}

function players() {
  const map = new Map();

  filteredRecords().forEach(r => {
    const id = String(r.playerId);

    if (!map.has(id)) {
      map.set(id, {
        id,
        name: r.name,
        games: 0,
        totals: {},
        available: new Set(),
        ratings: [],
        positions: {}
      });
    }

    const p = map.get(id);

    p.games++;
    p.name = r.name || p.name;

    p.positions[r.position] =
      (p.positions[r.position] || 0) + 1;

    if (r.rating !== null && Number.isFinite(Number(r.rating))) {
      p.ratings.push(Number(r.rating));
    }

    Object.entries(r.stats || {}).forEach(([key, value]) => {
      p.totals[key] = (p.totals[key] || 0) + num(value);
      p.available.add(key);
    });
  });

  return [...map.values()].map(p => {
    const position = Object.entries(p.positions)
      .sort((a, b) => b[1] - a[1])[0];

    return {
      ...p,
      position: position ? position[0] : "Unknown",
      rating: p.ratings.length
        ? p.ratings.reduce((a, b) => a + b, 0) / p.ratings.length
        : null
    };
  });
}

// ==========================================
// METRIC CALCULATIONS
// ==========================================

function metric(player, key) {
  if (key === "rating") return player.rating;

  const config = METRICS[key];
  if (!config) return null;

  const mode = config.mode;

  if (mode === "rate") {
    return has(player, config.field)
      ? sum(player, config.field) / player.games
      : null;
  }

  if (mode === "recoveries" || mode === "losses") {
    const prefix = mode === "recoveries"
      ? "possessionWon"
      : "possessionLost";

    const fields = [
      prefix + "DefensiveThird",
      prefix + "MiddleThird",
      prefix + "AttackingThird"
    ];

    if (!fields.some(f => has(player, f))) return null;

    return fields.reduce((a, f) => a + sum(player, f), 0)
      / player.games;
  }

  if (mode === "forwardAccuracy") {
    if (!has(player, "passesCompletedForward") ||
        !has(player, "passesFailedForward")) return null;

    return ratio(
      sum(player, "passesCompletedForward"),
      sum(player, "passesCompletedForward") +
      sum(player, "passesFailedForward")
    );
  }

  if (mode === "passingAccuracy") {
    if (!has(player, "passesCompleted") ||
        !has(player, "passesFailed")) return null;

    return ratio(
      sum(player, "passesCompleted"),
      sum(player, "passesCompleted") +
      sum(player, "passesFailed")
    );
  }

  if (mode === "backwardShare") {
    const fields = [
      "passesCompletedForward",
      "passesFailedForward",
      "passesCompletedBackward",
      "passesFailedBackward",
      "passesCompletedSideways",
      "passesFailedSideways"
    ];

    if (!fields.every(f => has(player, f))) return null;

    const attempts = fields.reduce(
      (a, f) => a + sum(player, f), 0
    );

    return ratio(
      sum(player, "passesCompletedBackward") +
      sum(player, "passesFailedBackward"),
      attempts
    );
  }

  if (mode === "shootingAccuracy") {
    if (!has(player, "shotsOnTarget") ||
        !has(player, "shotsOffTarget")) return null;

    return ratio(
      sum(player, "shotsOnTarget"),
      sum(player, "shotsOnTarget") +
      sum(player, "shotsOffTarget")
    );
  }

  if (mode === "conversion") {
    if (!has(player, "goals") || !has(player, "shots")) {
      return null;
    }

    return ratio(sum(player, "goals"), sum(player, "shots"));
  }

  return null;
}

function attempts(player, key) {
  if (key === "forwardAccuracy") {
    return sum(player, "passesCompletedForward") +
      sum(player, "passesFailedForward");
  }

  if (key === "passing") {
    return sum(player, "passesCompleted") +
      sum(player, "passesFailed");
  }

  if (key === "backward") {
    return [
      "passesCompletedForward",
      "passesFailedForward",
      "passesCompletedBackward",
      "passesFailedBackward",
      "passesCompletedSideways",
      "passesFailedSideways"
    ].reduce((a, f) => a + sum(player, f), 0);
  }

  if (key === "shooting") {
    return sum(player, "shotsOnTarget") +
      sum(player, "shotsOffTarget");
  }

  if (key === "conversion") {
    return sum(player, "shots");
  }

  return Infinity;
}

function qualified(player, key) {
  const minGames = Number($("minimum").value);
  const minAttempts = METRICS[key]?.minAttempts || 0;

  return player.games >= minGames &&
    attempts(player, key) >= minAttempts;
}

function ranking(key, direction = "best") {
  const config = METRICS[key];

  const higher = key === "rating"
    ? true
    : config?.higher !== false;

  const descending = direction === "worst" ? !higher : higher;

  return players()
    .map(p => ({
      ...p,
      value: metric(p, key),
      qualified: qualified(p, key)
    }))
    .sort((a, b) => {
      const aValid = a.value !== null && a.qualified;
      const bValid = b.value !== null && b.qualified;

      if (aValid !== bValid) return aValid ? -1 : 1;

      if (a.value === null && b.value !== null) return 1;
      if (b.value === null && a.value !== null) return -1;

      if (a.value === null && b.value === null) {
        return a.name.localeCompare(b.name);
      }

      const diff = descending
        ? b.value - a.value
        : a.value - b.value;

      return diff || b.games - a.games ||
        a.name.localeCompare(b.name);
    });
}

function format(value, key) {
  if (value === null || !Number.isFinite(value)) return "N/A";

  const percent = [
    "forwardAccuracy", "passing", "backward",
    "shooting", "conversion"
  ].includes(key);

  return value.toFixed(percent ? 1 : 2) +
    (percent ? "%" : "");
}

// ==========================================
// RANKINGS
// ==========================================

function rankingRows(key) {
  const ranked = ranking(key);
  const valid = ranked.filter(p => p.value !== null);

  const max = Math.max(
    0.01,
    ...valid.map(p => Math.max(0, p.value))
  );

  return ranked.map((p, i) => {
    const width = p.value === null
      ? 0
      : Math.max(0, p.value) / max * 100;

    return `
      <div class="rank-row">
        <div class="rank-number">${i + 1}</div>

        <div>
          <div class="rank-name">${esc(p.name)}</div>
          <div class="muted">
            ${p.games} games · ${esc(p.position)}
            ${p.qualified ? "" : " · Provisional"}
          </div>
        </div>

        <div class="bar">
          <div class="fill" style="width:${width}%"></div>
        </div>

        <div class="value">${format(p.value, key)}</div>
      </div>
    `;
  }).join("");
}

function renderRankings() {
  const category = CATEGORIES[currentCategory];

  const buttons = CATEGORIES.map((c, i) => `
    <button data-category="${i}"
      class="${i === currentCategory ? "active" : ""}">
      ${esc(c.name)}
    </button>
  `).join("");

  const sections = category.metrics.map(key => `
    <div class="panel">
      <h3>${esc(METRICS[key].label)}</h3>
      <p>
        ${
          METRICS[key].higher === false
            ? "Lower is generally better."
            : "Higher is generally better."
        }
        Rankings prioritise qualifying players.
      </p>
      ${rankingRows(key)}
    </div>
  `).join("");

  const rated = ranking("rating").filter(
    p => p.qualified && p.value !== null
  );

  const medals = ["🥇", "🥈", "🥉"];

  const podium = rated.slice(0, 3).map((p, i) => `
    <div class="podium-card ${i === 0 ? "first" : ""}">
      <div class="medal">${medals[i]}</div>
      <div class="podium-name">${esc(p.name)}</div>
      <div class="podium-score">${p.value.toFixed(1)}</div>
      <div class="muted">
        EA match rating<br>${p.games} matches
      </div>
    </div>
  `).join("");

  $("rankings").innerHTML = `
    <h2>🏆 Panda Rankings</h2>
    <p>
      The full squad, ranked by performance.
      Overall standings currently use EA's average match rating;
      a position-adjusted Panda Score is planned.
    </p>

    ${
      podium
        ? `<div class="podium">${podium}</div>`
        : `<div class="panel empty">Not enough rated matches yet.</div>`
    }

    <div class="panel">
      <h3>Overall Squad Standings</h3>
      ${rankingRows("rating")}
    </div>

    <h2>Category Rankings</h2>
    <div class="buttons">${buttons}</div>
    ${sections}
  `;
}

// ==========================================
// PANDA LAB — INDIVIDUAL ANALYSIS
// ==========================================

function metricCard(label, value, detail = "") {
  return `
    <div class="metric-card">
      <div class="metric-label">${esc(label)}</div>
      <div class="metric-value">${esc(value)}</div>
      <div class="metric-detail">${esc(detail)}</div>
    </div>
  `;
}

function directionRow(label, completed, failed, totalAttempts) {
  const attempted = completed + failed;
  const share = ratio(attempted, totalAttempts);
  const accuracy = ratio(completed, attempted);

  return `
    <div class="direction-row">
      <div class="direction-label">
        <strong>${esc(label)}</strong>
        <span>
          ${attempted} attempts ·
          ${accuracy === null ? "N/A" : accuracy.toFixed(1) + "%"} accuracy
        </span>
      </div>

      <div class="bar">
        <div class="fill"
          style="width:${share === null ? 0 : share}%"></div>
      </div>
    </div>
  `;
}

function renderLab() {
  const squad = players().sort((a, b) =>
    a.name.localeCompare(b.name)
  );

  if (!squad.length) {
    $("lab").innerHTML = '<div class="panel empty">No player data.</div>';
    return;
  }

  if (!squad.some(p => p.id === selectedPlayer)) {
    selectedPlayer = squad[0].id;
  }

  const p = squad.find(x => x.id === selectedPlayer);

  const options = squad.map(x => `
    <option value="${esc(x.id)}"
      ${x.id === selectedPlayer ? "selected" : ""}>
      ${esc(x.name)}
    </option>
  `).join("");

  const directions = [
    ["⬆️ Forward", "Forward"],
    ["⬇️ Backward", "Backward"],
    ["↔️ Sideways", "Sideways"]
  ];

  const totalAttempts = directions.reduce((a, [, direction]) =>
    a +
    sum(p, "passesCompleted" + direction) +
    sum(p, "passesFailed" + direction), 0
  );

  const directionHTML = directions.map(([label, direction]) =>
    directionRow(
      label,
      sum(p, "passesCompleted" + direction),
      sum(p, "passesFailed" + direction),
      totalAttempts
    )
  ).join("");

  const metrics = [
    ["Goals / match", format(metric(p, "goals"), "goals"),
     "Goals scored per appearance."],
    ["Assists / match", format(metric(p, "assists"), "assists"),
     "Direct assists per appearance."],
    ["Forward accuracy",
     format(metric(p, "forwardAccuracy"), "forwardAccuracy"),
     "Completed forward passes divided by forward attempts."],
    ["Overall pass accuracy",
     format(metric(p, "passing"), "passing"),
     "Completed passes divided by attempted passes."],
    ["Interceptions / match",
     format(metric(p, "interceptions"), "interceptions"),
     "Recorded interceptions per appearance."],
    ["Possession recovered / match",
     format(metric(p, "recoveries"), "recoveries"),
     "Possession won across the three pitch thirds."],
    ["Possession lost / match",
     format(metric(p, "losses"), "losses"),
     "Possession lost across the three pitch thirds."],
    ["Defensive-third losses / match",
     format(metric(p, "danger"), "danger"),
     "Possession losses close to your own goal."],
    ["Best decisions / match",
     format(metric(p, "decisions"), "decisions"),
     "EA feedback for choosing the best option."]
  ];

  const availableMetrics = Object.keys(METRICS)
    .map(key => ({
      key,
      value: metric(p, key),
      config: METRICS[key]
    }))
    .filter(x => x.value !== null);

  const strengths = availableMetrics
    .filter(x => x.config.higher !== false)
    .map(x => {
      const squadValues = squad
        .map(q => metric(q, x.key))
        .filter(v => v !== null);

      const average = squadValues.length
        ? squadValues.reduce((a, b) => a + b, 0) /
          squadValues.length
        : 0;

      return {
        ...x,
        difference: average > 0
          ? (x.value - average) / average
          : 0
      };
    })
    .sort((a, b) => b.difference - a.difference);

  const strongest = strengths[0];

  $("lab").innerHTML = `
    <h2>🔬 Panda Lab</h2>
    <p>
      Understand how each player performs, not just where they rank.
    </p>

    <div class="panel">
      <label>
        Select player
        <select id="labPlayer">${options}</select>
      </label>
    </div>

    <div class="profile">
      <div class="profile-rating">
        ${p.rating === null ? "—" : p.rating.toFixed(1)}
      </div>
      <div class="muted">Average EA match rating</div>
      <h2>🐼 ${esc(p.name)}</h2>
      <p>${esc(p.position)} · ${p.games} appearances</p>
    </div>

    <div class="panel">
      <h2>🧬 Passing DNA</h2>
      <p>
        Passing direction, volume and completion.
        Directional events may not include every recorded pass.
      </p>
      ${directionHTML}
    </div>

    <div class="panel">
      <h2>📊 Performance Breakdown</h2>
      <div class="metric-grid">
        ${metrics.map(m => metricCard(...m)).join("")}
      </div>
    </div>

    <div class="panel">
      <h2>🧠 Performance Insights</h2>

      ${
        strongest
          ? `<div class="note">
               <strong>Relative strength:</strong>
               ${esc(strongest.config.label)}.
               This is one of the player's stronger metrics
               relative to the selected squad.
             </div>`
          : `<div class="note">
               More match data is needed to identify strengths.
             </div>`
      }

      <div class="note warning">
        <strong>Coaching note:</strong>
        Interpret possession losses and backward passes
        in the context of playing position.
        These statistics alone don't prove poor decisions.
      </div>
    </div>
  `;

  $("labPlayer").onchange = e => {
    selectedPlayer = e.target.value;
    renderLab();
  };
}

// ==========================================
// PLAYER CARDS
// ==========================================

function renderPlayers() {
  const squad = players().sort((a, b) =>
    (b.rating ?? -1) - (a.rating ?? -1)
  );

  $("players").innerHTML = `
    <h2>🃏 Panda XI</h2>
    <p>
      Performance cards based on recorded matches.
      EA build attributes and character portraits
      will be added separately.
    </p>

    <div class="grid">
      ${squad.map(p => `
        <div class="profile">
          <div class="profile-rating">
            ${p.rating === null ? "—" : p.rating.toFixed(1)}
          </div>

          <div class="muted">EA match rating</div>

          <h3>🐼 ${esc(p.name)}</h3>

          <p>${esc(p.position)} · ${p.games} matches</p>

          <div class="metric-grid">
            ${metricCard("Goals", sum(p, "goals"))}
            ${metricCard("Assists", sum(p, "assists"))}
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

// ==========================================
// AWARDS
// ==========================================

function awardCard(title, winner, key, description, shame = false) {
  return `
    <div class="award ${shame ? "shame" : ""}">
      <div class="award-title">${esc(title)}</div>

      <div class="award-player">
        ${winner ? esc(winner.name) : "TBD"}
      </div>

      <div class="award-number">
        ${winner ? format(winner.value, key) : "—"}
      </div>

      <div class="award-description">
        ${esc(METRICS[key]?.label ||
          (key === "rating" ? "Average EA match rating" : key))}
      </div>

      <div class="award-footer">
        ${esc(description)}
        ${
          winner
            ? `<br><span class="muted">
                 ${winner.games} recorded matches
               </span>`
            : ""
        }
      </div>
    </div>
  `;
}

function awardWinner(key, worst = false) {
  const ranked = ranking(key, worst ? "worst" : "best");

  return ranked.find(p =>
    p.qualified && p.value !== null
  ) || null;
}

function renderAwards() {
  $("awards").innerHTML = `
    <h2>🌟 Hall of Pandas</h2>
    <p>The squad's standout performers.</p>

    <div class="award-grid">
      ${POSITIVE_AWARDS.map(([title, key, description]) =>
        awardCard(
          title,
          awardWinner(key),
          key,
          description
        )
      ).join("")}
    </div>
  `;
}

function renderShame() {
  $("shame").innerHTML = `
    <h2>💀 Wall of Shame</h2>
    <p>
      Friendly banter with useful improvement suggestions.
      Only players meeting participation thresholds
      are eligible for awards.
    </p>

    <div class="award-grid">
      ${NEGATIVE_AWARDS.map(([title, key, advice, direction]) => {
        const ranked = ranking(key, "best");

        const winner = ranked
          .filter(p => p.qualified && p.value !== null)
          .sort((a, b) =>
            direction === "high"
              ? b.value - a.value
              : a.value - b.value
          )[0];

        return awardCard(
          title,
          winner || null,
          key,
          "Redemption plan: " + advice,
          true
        );
      }).join("")}
    </div>
  `;
}

// ==========================================
// MAIN RENDER
// ==========================================

function render() {
  const squad = players();
  const matches = filteredMatches();

  $("summary").innerHTML = [
    ["Recorded Matches", matches.length],
    ["Players", squad.length],
    ["Player Appearances",
      squad.reduce((a, p) => a + p.games, 0)]
  ].map(([label, value]) => `
    <div class="panel">
      <div class="stat">${value}</div>
      <div class="muted">${esc(label)}</div>
    </div>
  `).join("");

  renderRankings();
  renderLab();
  renderPlayers();
  renderAwards();
  renderShame();

  document.querySelectorAll("[data-category]").forEach(button => {
    button.onclick = () => {
      currentCategory = Number(button.dataset.category);
      render();
    };
  });

  document.querySelectorAll("section").forEach(section => {
    section.classList.toggle(
      "hidden",
      section.id !== currentView
    );
  });

  document.querySelectorAll("[data-view]").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.view === currentView
    );
  });
}

document.querySelectorAll("[data-view]").forEach(button => {
  button.onclick = () => {
    currentView = button.dataset.view;
    render();
  };
});

["club", "period", "minimum"].forEach(id => {
  $(id).onchange = render;
});

google.script.run
  .withSuccessHandler(data => {
    if (!data || !data.ok) {
      $("loading").textContent =
        data?.message || "No data returned.";
      return;
    }

    raw = data;

    $("loading").classList.add("hidden");
    $("app").classList.remove("hidden");

    render();
  })
  .withFailureHandler(error => {
    $("loading").textContent =
      "Unable to load PandaMetrics: " + error.message;
  })
  .getDashboardData();

</script>
</body>
</html>
