    const minAttempts = thresholds && thresholds.minAttempts !== undefined
      ? thresholds.minAttempts
      : metric.minAttempts;
    const reasons = [];

    if (!agg.matchesWithData) return { status: "no_data", reasons: ["No matches with this data"] };

    if (agg.matchesWithData < minMatches) {
      reasons.push(agg.matchesWithData + " of " + minMatches + " matches");
    }
    if (metric.type === "ratio" && (agg.denominator || 0) < minAttempts) {
      reasons.push((agg.denominator || 0) + " of " + minAttempts + " attempts");
    }
    if (metric.type === "ratio" && agg.rate === null) {
      return { status: "no_data", reasons: ["No attempts"] };
    }
    return { status: reasons.length ? "provisional" : "qualified", reasons };
  }

  // --------------------------------------------------------- grouping

  // Player identity is EA playerId (verified stable across all three clubs).
  function groupByPlayer(rows) {
    const map = new Map();
    rows.forEach(row => {
      const id = String(row.playerId || "").trim();
      if (!id) return;
      if (!map.has(id)) map.set(id, { id, name: null, latest: -Infinity, rows: [] });
      const player = map.get(id);
      player.rows.push(row);
      const when = parseTimestamp(row);
      const t = when ? when.getTime() : -Infinity;
      if (row.name && (t >= player.latest || !player.name)) {
        player.name = String(row.name);
        player.latest = t;
      }
    });
    return [...map.values()].map(p => ({ id: p.id, name: p.name || p.id, rows: p.rows }));
  }

  // Filters apply to appearances before aggregation.
  function filterRows(rows, filters) {
    const f = filters || {};
    return rows.filter(row => {
      if (f.clubIds && f.clubIds.length && !f.clubIds.includes(String(row.clubId))) return false;
      if (f.matchTypes && f.matchTypes.length && !f.matchTypes.includes(String(row.matchType || "leagueMatch"))) return false;
      if (f.groups && f.groups.length && !f.groups.includes(positionGroup(row))) return false;
      if (f.playerIds && f.playerIds.length && !f.playerIds.includes(String(row.playerId))) return false;
      if (f.from || f.to) {
        const when = parseTimestamp(row);
        if (!when) return false;
        if (f.from && when < f.from) return false;
        if (f.to && when >= f.to) return false;
      }
      return true;
    });
  }

  // ------------------------------------------------------------ ranking

  function compareValues(a, b, higherIsBetter) {
    return higherIsBetter === false ? a - b : b - a;
  }

  // Competition ranking (1, 2, 2, 4). Provisional players are listed
  // separately and never receive a rank.
  function rank(players, key, options) {
    const metric = getMetric(key);
    const opts = options || {};
    const view = opts.view || "perMatch";
    const thresholds = { minMatches: opts.minMatches || 0 };
    if (opts.minAttempts !== undefined) thresholds.minAttempts = opts.minAttempts;

    const entries = players.map(player => {
      const agg = aggregate(player.rows, key);
      const q = qualify(agg, key, thresholds);
      return {
        id: player.id,
        name: player.name,
        value: headlineValue(agg, metric, view),
        aggregate: agg,
        status: q.status,
        reasons: q.reasons
      };
    });

    const direction = metric.higherIsBetter === null ? true : metric.higherIsBetter;
    const byValue = (a, b) =>
      compareValues(a.value, b.value, direction) ||
      b.aggregate.matchesWithData - a.aggregate.matchesWithData ||
      String(a.name).localeCompare(String(b.name));

    const ranked = entries
      .filter(e => e.status === "qualified" && e.value !== null)
      .sort(byValue);

    let previous = null;
    ranked.forEach((entry, index) => {
      entry.rank = previous !== null && entry.value === previous.value ? previous.rank : index + 1;
      previous = entry;
    });

    return {
      metric: key,
      view,
      contextOnly: metric.higherIsBetter === null,
      ranked,
      provisional: entries.filter(e => e.status === "provisional" && e.value !== null).sort(byValue),
      noData: entries.filter(e => e.status === "no_data" || e.value === null)
    };
  }

  // ------------------------------------------------- Panda Score (role-aware)

  // Per-appearance weights by the position group actually played in that
  // match. Only verified/high-confidence metrics; no EA rating, no
  // experimental events, and no source field used by two components of the
  // same role (enforced by tests).
  const ROLE_WEIGHTS = {
    ATT: { goals: 3, assists: 2, shotAccuracy: 1.5, dribblesCompleted: 1,
           highRecoveries: 1, passAccuracy: 1 },
    MID: { passAccuracy: 2, forwardPassesCompleted: 2, assists: 1.5, goals: 1,
           throughPasses: 1, interceptions: 1, tacklesWon: 1, possessionLost: 1 },
    DEF: { interceptions: 2, defensiveThirdLosses: 2, tackleSuccess: 2,
           passAccuracy: 1.5, aerialDuelsWonDefending: 1, crossesBlocked: 0.5,
           outOfPosition: 1 },
    GK: { saves: 2, goalsConceded: 2, passAccuracy: 1 }
  };

  const SCORE_SETTINGS = {
    minBenchmarkAppearances: 10,
    minWeightCoverage: 0.6
  };

  // One appearance's value for a metric, comparable across appearances:
  // counts per 90 (minimum 20 minutes), ratios shrunk towards the benchmark
  // rate so a 1/1 shot does not count as 100%.
  function appearanceValue(row, metric, priorRate) {
    if (!rowHasData(row, metric)) return null;

    if (metric.type === "ratio") {
      const num = sumFields(row, metric.numerator);
      const den = sumFields(row, metric.denominator);
      const k = metric.shrinkage || 0;
      if (den + k === 0) return null;
      const prior = priorRate === null || priorRate === undefined ? 0 : priorRate;
      return (num + k * prior) / (den + k) * 100;
    }

    if (metric.type === "mean") return toNumber(row[metric.fields[0]]);

    const total = sumFields(row, metric.fields);
    const seconds = toNumber(row.secondsPlayed);
    if (seconds === null || seconds <= 0) return total;
    return total / Math.max(seconds, MIN_SECONDS_FOR_RATE) * SECONDS_PER_90;
  }

  function percentile(sorted, value) {
    if (!sorted.length) return null;
    let below = 0;
    let equal = 0;
    for (let i = 0; i < sorted.length; i++) {
      if (sorted[i] < value) below++;
      else if (sorted[i] === value) equal++;
      else break;
    }
    return (below + equal / 2) / sorted.length * 100;
  }

  // Benchmarks: for each role and metric, the distribution of appearance
  // values among all appearances in that role. Small roles fall back to all
  // appearances so one or two games do not define "typical".
  function buildBenchmarks(rows) {
    const appearances = rows.filter(row => isAppearance(row) && positionGroup(row));
    const benchmarks = {};

    Object.keys(ROLE_WEIGHTS).forEach(group => {
      const groupRows = appearances.filter(row => positionGroup(row) === group);
      benchmarks[group] = { appearances: groupRows.length, metrics: {} };

      Object.keys(ROLE_WEIGHTS[group]).forEach(key => {
        const metric = getMetric(key);
        let source = groupRows.filter(row => rowHasData(row, metric));
        let fallback = false;
        if (source.length < SCORE_SETTINGS.minBenchmarkAppearances) {
          source = appearances.filter(row => rowHasData(row, metric));
          fallback = true;
        }
        const pooled = metric.type === "ratio" ? aggregate(source, key).rate : null;
        const prior = pooled === null ? null : pooled / 100;
        const values = source
          .map(row => appearanceValue(row, metric, prior))
          .filter(v => v !== null)
          .sort((a, b) => a - b);
        benchmarks[group].metrics[key] = { values, prior, fallback, sample: values.length };
      });
    });
    return benchmarks;
  }

  function scoreAppearance(row, benchmarks) {
    const group = positionGroup(row);
    if (!group || !isAppearance(row) || !ROLE_WEIGHTS[group]) return null;

    const weights = ROLE_WEIGHTS[group];
    const totalWeight = Object.values(weights).reduce((a, b) => a + b, 0);
    let usedWeight = 0;
    let weighted = 0;
    const contributions = {};

    Object.keys(weights).forEach(key => {
      const metric = getMetric(key);
      const bench = benchmarks[group].metrics[key];
      if (!bench || !bench.values.length) return;
      const value = appearanceValue(row, metric, bench.prior);
      if (value === null) return;
      let pct = percentile(bench.values, value);
      if (metric.higherIsBetter === false) pct = 100 - pct;
      contributions[key] = { value, percentile: pct, weight: weights[key], fallback: bench.fallback };
      usedWeight += weights[key];
      weighted += pct * weights[key];
    });

    const coverage = usedWeight / totalWeight;
    if (coverage < SCORE_SETTINGS.minWeightCoverage) {
      return { group, score: null, coverage, contributions, reason: "Not enough data for this role" };
    }
    return { group, score: weighted / usedWeight, coverage, contributions };
  }

  // Player score = mean of per-appearance role scores, so a player who
  // splits time between roles is judged against the right peers each match.
  function pandaScore(playerRows, benchmarks, options) {
    const opts = options || {};
    const minMatches = opts.minMatches || 0;
    const scored = playerRows
      .map(row => scoreAppearance(row, benchmarks))
      .filter(s => s && s.score !== null);

    const byGroup = {};
    const metricPct = {};
    scored.forEach(s => {
      byGroup[s.group] = byGroup[s.group] || { total: 0, appearances: 0 };
      byGroup[s.group].total += s.score;
      byGroup[s.group].appearances++;
      Object.entries(s.contributions).forEach(([key, c]) => {
        metricPct[key] = metricPct[key] || { total: 0, count: 0 };
        metricPct[key].total += c.percentile;
        metricPct[key].count++;
      });
    });

    const score = scored.length
      ? scored.reduce((a, s) => a + s.score, 0) / scored.length
      : null;

    Object.keys(byGroup).forEach(group => {
      byGroup[group] = {
        score: byGroup[group].total / byGroup[group].appearances,
        appearances: byGroup[group].appearances
      };
    });

    const metrics = Object.keys(metricPct).map(key => {
      const metric = getMetric(key);
      return {
        key,
        label: metric.label,
        strengthLabel: metric.strengthLabel,
        weaknessLabel: metric.weaknessLabel,
        percentile: metricPct[key].total / metricPct[key].count,
        appearances: metricPct[key].count
      };
    }).sort((a, b) => b.percentile - a.percentile);

    return {
      score,
      scoredAppearances: scored.length,
      status: score === null ? "no_data"
        : scored.length < minMatches ? "provisional" : "qualified",
      byGroup,
      strengths: metrics.filter(x => x.percentile >= 60).slice(0, 3)
        .map(x => Object.assign({}, x, { label: x.strengthLabel })),
      weaknesses: metrics.filter(x => x.percentile <= 40).reverse().slice(0, 3)
        .map(x => Object.assign({}, x, { label: x.weaknessLabel })),
      metrics
    };
  }

  // ------------------------------------------------------------- periods

  // Created on first use: every Apps Script request (including the webhook)
  // evaluates this file, so nothing that could fail runs at load time.
  let londonFormatter = null;

  function formatter() {
    if (!londonFormatter) {
      londonFormatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: TIMEZONE,
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", hour12: false, weekday: "short"
      });
    }
    return londonFormatter;
  }

  const WEEKDAYS = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };

  function parseTimestamp(row) {
    const unix = toNumber(row.timestampUnix);
    if (unix !== null && unix > 0) return new Date(unix * 1000);
    const value = row.timestamp;
    if (value instanceof Date) return isNaN(value) ? null : value;
    if (value === null || value === undefined || value === "") return null;
    const numeric = toNumber(value);
    if (numeric !== null) return new Date(numeric > 1e11 ? numeric : numeric * 1000);
    const parsed = new Date(String(value));
    return isNaN(parsed) ? null : parsed;
  }

  function londonParts(date) {
    const parts = {};
    formatter().formatToParts(date).forEach(p => { parts[p.type] = p.value; });
    return {
      year: Number(parts.year),
      month: Number(parts.month),
      day: Number(parts.day),
      hour: Number(parts.hour) % 24,
      weekday: WEEKDAYS[parts.weekday]
    };
  }

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  // Monday-Sunday weeks in Europe/London, keyed by the Monday's date.
  function weekKey(date) {
    const p = londonParts(date);
    const civil = new Date(Date.UTC(p.year, p.month - 1, p.day));
    civil.setUTCDate(civil.getUTCDate() - (p.weekday - 1));
    return civil.getUTCFullYear() + "-" + pad(civil.getUTCMonth() + 1) + "-" + pad(civil.getUTCDate());
  }

  function monthKey(date) {
    const p = londonParts(date);
    return p.year + "-" + pad(p.month);
  }

  function periodKey(date, period) {
    return period === "month" ? monthKey(date) : weekKey(date);
  }

  // A period is complete once "now" is in a later period.
  function isPeriodComplete(key, period, now) {
    return periodKey(now, period) > key;
  }

  // The UTC instant of 00:00 Europe/London on a civil date. London is UTC+0
  // or UTC+1, so midnight is either 00:00 or 23:00 (previous day) UTC.
  function londonMidnight(year, month, day) {
    const bst = new Date(Date.UTC(year, month - 1, day) - 3600 * 1000);
    const p = londonParts(bst);
    if (p.day === day && p.hour === 0) return bst;
    return new Date(Date.UTC(year, month - 1, day));
  }

  // [start, end) of a week ("YYYY-MM-DD" Monday) or month ("YYYY-MM") key.
  function periodBounds(key, period) {
    const [y, mo, d] = key.split("-").map(Number);
    if (period === "month") {
      const next = mo === 12 ? [y + 1, 1] : [y, mo + 1];
      return { start: londonMidnight(y, mo, 1), end: londonMidnight(next[0], next[1], 1) };
    }
    const civil = new Date(Date.UTC(y, mo - 1, d + 7));
    return {
      start: londonMidnight(y, mo, d),
      end: londonMidnight(civil.getUTCFullYear(), civil.getUTCMonth() + 1, civil.getUTCDate())
    };
  }

  function previousPeriodKey(key, period) {
    const { start } = periodBounds(key, period);
    return periodKey(new Date(start.getTime() - 3600 * 1000), period);
  }

  function percentagePointChange(before, after) {
    if (before === null || after === null || before === undefined || after === undefined) return null;
    return after - before;
  }

  // ----------------------------------------------------------- public API

  return {
    TIMEZONE,
    SECONDS_PER_90,
    POSITION_GROUPS,
    GROUP_LABELS,
    GROUPS,
    CATEGORIES,
    METRICS,
    ROLE_WEIGHTS,
    SCORE_SETTINGS,
    EXPERIMENTAL_FIELDS,
    experimentalFields,
    positionGroup,
    toNumber,
    isAppearance,
    eventsUsable,
    dedupeAppearances,
    getMetric,
    requiredFields,
    formula,
    aggregate,
    headlineValue,
    qualify,
    groupByPlayer,
    filterRows,
    rank,
    appearanceValue,
    percentile,
    buildBenchmarks,
    scoreAppearance,
    pandaScore,
    parseTimestamp,
    londonParts,
    weekKey,
    monthKey,
    periodKey,
    isPeriodComplete,
    londonMidnight,
    periodBounds,
    previousPeriodKey,
    percentagePointChange
  };
})();

//
// Pure view-model builders for the six dashboard sections, on top of
// PandaStats. Browser-only: inlined into the page by tools/build_client.js and
// never pushed as a server file, so it cannot affect doPost or be reached via
// google.script.run.

var PandaInsights = (function () {
  "use strict";

  const S = PandaStats;

  // One metric per idea per category: no duplicates across categories.
  const DISPLAY_CATEGORIES = [
    { key: "passing", label: "🎯 Passing",

                "shortPassAccuracy", "longPassAccuracy", "crossesCompleted"] },
    { key: "attacking", label: "⚽ Attacking",

    { key: "creativity", label: "🪄 Creativity",

  const LAB_CATEGORIES = [
    { key: "passing", label: "🎯 Passing",

    { key: "attacking", label: "⚽ Attacking",
      metrics: ["goals", "shots", "shotsInsideBox", "shotsOutsideBox", "shotAccuracy", "conversion",

    { key: "creativity", label: "🪄 Creativity",
      metrics: ["assists", "secondAssists", "throughPasses", "throughBallAssists", "switchesOfPlay", "firstTimePasses"] },
    { key: "defending", label: "🛡️ Defending",
      metrics: ["tacklesWon", "tacklesLost", "tackleSuccess", "interceptions", "opponentsDispossessed",
                "crossesBlocked", "aerialDuelsWonDefending"] },
    { key: "possession", label: "🔄 Possession",
      metrics: ["possessionWon", "highRecoveries", "possessionLost", "defensiveThirdLosses",
                "dribblesCompleted", "playersBeaten"] },
    { key: "decisions", label: "🧠 Decisions",
      metrics: ["goodDecisionShare", "bestOptionTaken", "shouldHavePassedElsewhere", "noGoodOption",

    { key: "discipline", label: "🟨 Discipline",
      metrics: ["foulsConceded", "foulsWon", "yellowCards", "redCards", "penaltiesConceded", "dangerousTackles"] },
    { key: "specialist", label: "🧤 Specialist",
      metrics: ["crossesCompleted", "crossAccuracy", "cornersTaken", "saves", "saveRate",
                "goalsConceded", "cleanSheets", "manOfTheMatch"] },
    { key: "experimental", label: "🧪 Experimental", note: LAB_NOTE,
      metrics: ["expPlayerOffside", "expBadPass", "expOpenPlayCrosses", "expShouldHaveShot"] }
  ];

  const PERIODS = [
    { key: "all", label: "All recorded" },
    { key: "last28", label: "Last 28 days" },
    { key: "thisWeek", label: "This week" },
    { key: "lastWeek", label: "Last week" },
    { key: "thisMonth", label: "This month" },
    { key: "lastMonth", label: "Last month" }
  ];

  const MATCH_TYPES = [
    { key: "official", label: "Official (league + playoffs)", types: ["leagueMatch", "playoffMatch"] },
    { key: "league", label: "League", types: ["leagueMatch"] },
    { key: "playoff", label: "Playoffs", types: ["playoffMatch"] }
  ];

  const DEFAULT_STATE = {
    club: "all",
    period: "all",
    matchType: "official",
    group: "all",
    minMatches: 3,
    evolutionPeriod: "week",
    evolutionMetric: "pandaScore"
  };

  // --------------------------------------------------------------- utils

  function periodRange(key, now) {
    if (key === "all" || !key) return { from: null, to: null };
    if (key === "last28") return { from: new Date(now.getTime() - 28 * 86400000), to: null };
    const period = key.endsWith("Month") ? "month" : "week";
    let pk = S.periodKey(now, period);
    if (key.startsWith("last")) pk = S.previousPeriodKey(pk, period);
    const b = S.periodBounds(pk, period);
    return { from: b.start, to: b.end, key: pk };
  }

  function filtersFor(state, now) {
    const range = periodRange(state.period, now);
    const type = MATCH_TYPES.find(t => t.key === state.matchType) || MATCH_TYPES[0];
    return {
      clubIds: state.club && state.club !== "all" ? [String(state.club)] : null,
      matchTypes: type.types,
      groups: state.group && state.group !== "all" ? [state.group] : null,
      from: range.from,
      to: range.to
    };
  }

  function median(values) {
    if (!values.length) return null;
    const s = values.slice().sort((a, b) => a - b);
    const mid = Math.floor(s.length / 2);
    return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
  }

  function sum(values) {
    return values.reduce((a, b) => a + b, 0);
  }

  // ------------------------------------------------------------- prepare

  // Normalises the server payload once: dedupe, attach match type to legacy
  // rows, and build benchmarks from every official appearance so scores stay
  // comparable whatever filter is applied.
  function prepare(data) {
    const matchIndex = new Map();
    (data.matches || []).forEach(m => matchIndex.set(m.clubId + "|" + m.matchId, m));

    const deduped = S.dedupeAppearances(data.appearances || []);
    const rows = deduped.rows.map(r => {
      const match = matchIndex.get(r.clubId + "|" + r.matchId);
      const row = Object.assign({}, r, S.experimentalFields(r), {
        matchType: r.matchType || (match && match.matchType) || "leagueMatch",
        timestampUnix: r.timestampUnix || (match && match.timestampUnix) || null,
        result: match ? match.result : null
      });
      delete row.rawEvents;
      return row;
    });

    const official = rows.filter(r => r.matchType === "leagueMatch" || r.matchType === "playoffMatch");
    return {
      clubs: data.clubs || {},
      matches: (data.matches || []).filter(m => m.matchType !== "friendlyMatch"),
      rows: official,
      duplicatesDropped: deduped.dropped,
      benchmarks: S.buildBenchmarks(official),
      sync: data.sync || null,
      generatedAt: data.generatedAt || null
    };
  }

  function filteredMatches(prepared, filters) {
    return prepared.matches.filter(m => {
      if (filters.clubIds && !filters.clubIds.includes(String(m.clubId))) return false;
      if (filters.matchTypes && !filters.matchTypes.includes(m.matchType)) return false;
      const when = S.parseTimestamp(m);
      if ((filters.from || filters.to) && !when) return false;
      if (filters.from && when < filters.from) return false;
      if (filters.to && when >= filters.to) return false;
      return true;
    }).sort((a, b) => (b.timestampUnix || 0) - (a.timestampUnix || 0));
  }

  // ----------------------------------------------------------- coverage

  function coverage(rows) {
    const total = rows.length;
    const played = rows.filter(S.isAppearance);
    const didNotPlay = total - played.length;
    const withEvents = played.filter(S.eventsUsable).length;
    const groups = {};
    played.forEach(r => {
      const g = S.positionGroup(r) || "Unknown";
      groups[g] = (groups[g] || 0) + 1;
    });
    return {
      rows: total,
      appearances: played.length,
      didNotPlay,
      withEvents,
      eventsUnavailable: played.length - withEvents,
      eventCoveragePct: played.length ? withEvents / played.length * 100 : null,
      groups
    };
  }

  function metricCoverage(agg) {
    return {
      withData: agg.matchesWithData,
      appearances: agg.appearances,
      pct: agg.appearances ? agg.matchesWithData / agg.appearances * 100 : null
    };
  }

  // ----------------------------------------------------------- overview

  function clubSummaries(prepared, matches) {
    const out = {};
    Object.keys(prepared.clubs).forEach(id => {
      const list = matches.filter(m => String(m.clubId) === id);
      out[id] = {
        id,
        name: prepared.clubs[id],
        played: list.length,
        wins: list.filter(m => m.result === "win").length,
        draws: list.filter(m => m.result === "draw").length,
        losses: list.filter(m => m.result === "loss").length,
        goalsFor: sum(list.map(m => Number(m.goals) || 0)),
        goalsAgainst: sum(list.map(m => Number(m.goalsAgainst) || 0)),
        form: list.slice(0, 5).map(m => m.result),
        playoffs: list.filter(m => m.matchType === "playoffMatch").length
      };
    });
    return out;
  }

  // ------------------------------------------------------------- scoring

  function scoreTable(prepared, rows, minMatches) {
    return S.groupByPlayer(rows).map(p => {
      const result = S.pandaScore(p.rows, prepared.benchmarks, { minMatches });
      const appearances = p.rows.filter(S.isAppearance).length;
      return Object.assign({ id: p.id, name: p.name, appearances, rows: p.rows }, result);
    });
  }

  function rankScores(table) {
    const qualified = table.filter(t => t.status === "qualified").sort((a, b) => b.score - a.score);
    let prev = null;
    qualified.forEach((t, i) => {
      t.rank = prev && Math.abs(prev.score - t.score) < 1e-9 ? prev.rank : i + 1;
      prev = t;
    });
    return {
      qualified,
      provisional: table.filter(t => t.status === "provisional").sort((a, b) => b.score - a.score),
      noData: table.filter(t => t.status === "no_data")
    };
  }

  // ------------------------------------------------- role-adjusted rates

  // Compares a player's per-90 rate with what an average player would
  // produce in the same mix of position groups (pooled group rates).
  function roleAdjusted(playerRows, allRows, key) {
    const metric = S.getMetric(key);
    const actual = S.aggregate(playerRows, key);
    if (!actual.matchesWithData) return null;

    let expectedNum = 0;
    let expectedDen = 0;
    const byGroup = {};
    playerRows.forEach(r => {
      const g = S.positionGroup(r);
      if (g) byGroup[g] = (byGroup[g] || []).concat([r]);
    });

    Object.entries(byGroup).forEach(([g, rows]) => {
      const mine = S.aggregate(rows, key);
      if (!mine.matchesWithData) return;
      const peers = S.aggregate(allRows.filter(r => S.positionGroup(r) === g), key);
      if (metric.type === "ratio") {
        if (peers.rate === null) return;
        expectedNum += peers.rate / 100 * mine.denominator;
        expectedDen += mine.denominator;
      } else {
        const peerRate = peers.per90 !== null ? peers.per90 : peers.perMatch;
        const weight = mine.seconds ? mine.seconds / S.SECONDS_PER_90 : mine.matchesWithData;
        expectedNum += peerRate * weight;
        expectedDen += weight;
      }
    });

    if (!expectedDen) return null;
    const value = metric.type === "ratio" ? actual.rate
      : actual.per90 !== null ? actual.per90 : actual.perMatch;
    const expected = metric.type === "ratio" ? expectedNum / expectedDen * 100 : expectedNum / expectedDen;
    return {
      value,
      expected,
      diff: value === null ? null : value - expected,
      ratio: expected > 0 && value !== null ? value / expected : null,
      aggregate: actual
    };
  }

  // -------------------------------------------------------------- awards

  function eligible(table) {
    return table.filter(t => t.status === "qualified");
  }

  function pick(list, valueOf, direction) {
    const scored = list
      .map(item => ({ item, value: valueOf(item) }))
      .filter(x => x.value !== null && x.value !== undefined && Number.isFinite(x.value));
    if (!scored.length) return null;
    scored.sort((a, b) => direction === "low" ? a.value - b.value : b.value - a.value);
    return scored[0];
  }

  function awardEntry(def, winner, format) {
    return {
      key: def.key,
      title: def.title,
      shame: !!def.shame,
      description: def.description,
      advice: def.advice || "",
      winner: winner ? { id: winner.item.id, name: winner.item.name } : null,
      value: winner ? format(winner.value, winner.item) : null,
      sample: winner ? winner.item.appearances + " matches" : null
    };
  }

  function fmt(n, digits) {
    return n === null || n === undefined || !Number.isFinite(n) ? "—" : n.toFixed(digits);
  }

  function awards(prepared, rows, table, previousTable) {
    const pool = eligible(table);
    const allRows = prepared.rows;
    const byId = {};
    (previousTable || []).forEach(t => { byId[t.id] = t; });

    const totalOf = key => p => S.aggregate(p.rows, key).total;
    const rateOf = (key, groups) => p => {
      const rows = groups ? p.rows.filter(r => groups.includes(S.positionGroup(r))) : p.rows;
      const agg = S.aggregate(rows, key);
      if (agg.matchesWithData < 2) return null;
      return agg.per90 !== null ? agg.per90 : agg.perMatch;
    };
    const excess = key => p => {
      const r = roleAdjusted(p.rows, allRows, key);
      return r && r.aggregate.matchesWithData >= 2 ? r.diff : null;
    };
    const change = p => byId[p.id] && byId[p.id].status === "qualified" ? p.score - byId[p.id].score : null;
    const defensive = p => {
      const rows = p.rows.filter(r => ["DEF", "MID"].includes(S.positionGroup(r)));
      const t = S.aggregate(rows, "tacklesWon");
      const i = S.aggregate(rows, "interceptions");
      if (t.matchesWithData < 2 || i.matchesWithData < 2) return null;
      return (t.per90 !== null ? t.per90 : t.perMatch) + (i.per90 !== null ? i.per90 : i.perMatch);
    };
    const aerialRate = p => {
      const parts = [["ATT", "aerialDuelsWonAttacking"], ["MID", "aerialDuelsWonDefending"], ["DEF", "aerialDuelsWonDefending"]];
      let weighted = 0;
      let weight = 0;
      let matches = 0;
      parts.forEach(([group, key]) => {
        const agg = S.aggregate(p.rows.filter(r => S.positionGroup(r) === group), key);
        const rate = agg.per90 !== null ? agg.per90 : agg.perMatch;
        if (!agg.matchesWithData || rate === null) return;
        const w = agg.seconds ? agg.seconds / S.SECONDS_PER_90 : agg.matchesWithData;
        weighted += rate * w;
        weight += w;
        matches += agg.matchesWithData;
      });
      return matches >= 2 && weight ? weighted / weight : null;
    };
    const clearest = p => {
      const compared = roleAdjusted(p.rows, allRows, "goodDecisionShare");
      if (!compared || compared.diff <= 0 || compared.aggregate.matchesWithData < 2) return null;
      if ((compared.aggregate.denominator || 0) < S.getMetric("goodDecisionShare").minAttempts) return null;
      return compared.diff;
    };

    const hall = [
      [{ key: "pandaOfWeek", title: "🐼 Panda of the Period", description: "Highest position-adjusted Panda Score." },
       pick(pool, p => p.score), v => fmt(v, 0)],
      [{ key: "goldenBoot", title: "👟 Golden Boot", description: "Most goals." },
       pick(pool, totalOf("goals")), v => String(v)],
      [{ key: "assistKing", title: "🎁 Assist King", description: "Most assists." },
       pick(pool, totalOf("assists")), v => String(v)],
      [{ key: "forwardThinker", title: "🚀 Forward Thinker", description: "Most completed forward passes per 90 as a midfielder or defender." },
       pick(pool, rateOf("forwardPassesCompleted", ["MID", "DEF"])), v => fmt(v, 1) + " /90"],
      [{ key: "kungFuMaster", title: "🥋 Kung Fu Master", description: "Most tackles won + interceptions per 90 as a defender or midfielder (separate counters, no overlap)." },
       pick(pool, defensive), v => fmt(v, 1) + " /90"],
      [{ key: "crossMaster", title: "📐 Cross Master", description: "Most completed crosses per 90 as an attacker or midfielder." },
       pick(pool, rateOf("crossesCompleted", ["ATT", "MID"])), v => fmt(v, 1) + " /90"],
      [{ key: "aerialAce", title: "🦅 Aerial Ace", description: "Most aerial duels won per 90 in the duel that matches the position played: attacking duels for attackers, defensive duels for midfielders and defenders." },
       pick(pool, aerialRate), v => fmt(v, 1) + " /90"],
      [{ key: "clearestHead", title: "🧠 Clearest Head", description: "Best share of good passing decisions compared with players in the same positions." },
       pick(pool, clearest), v => "+" + fmt(v, 1) + " pp"],
      [{ key: "mostImproved", title: "📈 Most Improved", description: "Biggest Panda Score rise on the previous period." },
       pick(pool, change), v => "+" + fmt(v, 1)]
    ].map(([def, w, f]) => awardEntry(def, w, f));

    const shame = [
      [{ key: "shotgunTarget", title: "🎯 Shotgun Target", shame: true,
         description: "Lowest eligible position-adjusted Panda Score.",
         advice: "See your Panda Lab tips: the fix is in your weakest role metrics." },
       pick(pool, p => p.score, "low"), v => fmt(v, 0)],
      [{ key: "crabKing", title: "🦀 Crab King", shame: true,
         description: "Most backward passing above what players in the same positions usually play.",
         advice: "Scan before receiving so a forward option is ready." },
       pick(pool, excess("backwardPassShare")), v => "+" + fmt(v, 1) + " pp"],
      [{ key: "butterfingers", title: "🧈 Butterfingers", shame: true,
         description: "Most possession lost per 90 above positional peers.",
         advice: "Release the ball a touch earlier when two opponents close in." },
       pick(pool, excess("possessionLost")), v => "+" + fmt(v, 1) + " /90"],
      [{ key: "tunnelVision", title: "🙈 Tunnel Vision", shame: true,
         description: "Most 'better pass available' feedback per 90 above positional peers.",
         advice: "Check your shoulder before the ball arrives." },
       pick(pool, excess("shouldHavePassedElsewhere")), v => "+" + fmt(v, 1) + " /90"],
      [{ key: "lostPanda", title: "🗺️ Lost Panda", shame: true,
         description: "Most out-of-position flags per 90 above positional peers.",
         advice: "Recover your shape first after an attack breaks down." },
       pick(pool, excess("outOfPosition")), v => "+" + fmt(v, 1) + " /90"],
      [{ key: "offsideOutlet", title: "🚩 Offside Outlet", shame: true,
         description: "Most passes into offside per 90 above players in the same positions. This is the pass, not the player being caught offside.",
         advice: "Hold the through ball until the runner is level." },
       pick(pool, excess("offsidePasses")), v => "+" + fmt(v, 1) + " /90"],
      [{ key: "biggestDecline", title: "📉 Biggest Decline", shame: true,
         description: "Largest Panda Score drop on the previous period.",
         advice: "Compare this period's weakest metrics with last period in Evolution." },
       pick(pool, change, "low"), v => fmt(v, 1)]
    ].map(([def, w, f]) => {
      const entry = awardEntry(def, w, f);
      // A "shame" for a positive change or below-average excess is not a shame.
      if (w && ["crabKing", "butterfingers", "tunnelVision", "lostPanda", "offsideOutlet"].includes(def.key) && w.value <= 0) entry.winner = null;
      if (w && def.key === "biggestDecline" && w.value >= 0) entry.winner = null;
      if (!entry.winner) entry.value = null;
      return entry;
    });

    hall.forEach(a => {
      if (a.key === "mostImproved" && a.winner && pick(pool, change).value <= 0) {
        a.winner = null;
        a.value = null;
      }
    });

    return { hall, shame, eligible: pool.length };
  }

  // ------------------------------------------------------------- coaching

  const TIPS = {
    passAccuracy: "Take an extra touch to open your body before passing, and choose the safer option when pressed.",
    forwardPassesCompleted: "Look for the forward pass first: scan before receiving so the line-breaking option is ready.",
    assists: "Arrive in the half-spaces earlier and look for the cut-back instead of the cross.",
    goals: "Get into the box before the ball does; shots from inside the box are on target far more often.",
    shotAccuracy: "Shoot across the keeper and avoid low-angle efforts; a pass to a better-placed teammate counts too.",
    dribblesCompleted: "Attack the defender's weaker side and release before the second defender arrives.",
    highRecoveries: "Press the first pass straight after losing the ball in the final third.",
    throughPasses: "Watch for runs in behind and play the through ball early, before the line steps up.",
    interceptions: "Hold the passing lane between ball and runner instead of charging the ball carrier.",
    tacklesWon: "Jockey and wait for a heavy touch before committing to the tackle.",
    tackleSuccess: "Jockey and wait for a heavy touch before committing to the tackle.",
    possessionLost: "Release earlier when two opponents close in; a simple lay-off keeps the attack alive.",
    defensiveThirdLosses: "Near your own goal, a safe pass or clearance beats a risky dribble.",
    outOfPosition: "Recover your shape before joining the attack; let a teammate cover your space first.",
    aerialDuelsWonDefending: "Attack the ball at its highest point and body-check the striker before the cross.",
    crossesBlocked: "Show attackers onto their weaker foot and close the crossing angle early.",
    saves: "Hold your position longer before diving; let the shooter commit first.",
    goalsConceded: "Organise the line on set pieces and stay big in one-on-ones."
  };

  function coachingTips(score, benchmarks, playerRows) {
    if (!score || score.score === null) return [];
    const mainGroup = Object.entries(score.byGroup).sort((a, b) => b[1].appearances - a[1].appearances)[0];
    if (!mainGroup) return [];
    const group = mainGroup[0];
    return score.weaknesses
      .filter(w => TIPS[w.key])
      .slice(0, 3)
      .map(w => {
        const metric = S.getMetric(w.key);
        const groupRows = playerRows.filter(r => S.positionGroup(r) === group);
        const bench = benchmarks[group] && benchmarks[group].metrics[w.key];
        const agg = S.aggregate(groupRows.length ? groupRows : playerRows, w.key);
        const mine = metric.type === "ratio" ? agg.rate : (agg.per90 !== null ? agg.per90 : agg.perMatch);
        const typical = bench ? median(bench.values) : null;
        const unit = metric.type === "ratio" ? "%" : " per 90";
        return {
          metric: w.key,
          title: w.label,
          tip: TIPS[w.key],
          evidence: "As a " + S.GROUP_LABELS[group].toLowerCase() + ": " + fmt(mine, 1) + unit +
            " vs a typical " + fmt(typical, 1) + unit + " (" + agg.matchesWithData + " matches with data; better than " +
            Math.round(w.percentile) + "% of " + S.GROUP_LABELS[group].toLowerCase() + " appearances)."
        };
      });
  }

  // -------------------------------------------------------------- rankings

  function categoryRankings(players, category, state) {
    return category.metrics.map(key => {
      const metric = S.getMetric(key);
      const view = metric.type === "count" ? "per90" : "rate";
      const r = S.rank(players, key, { minMatches: state.minMatches, view });
      const usePerMatch = metric.type === "count" && r.ranked.concat(r.provisional).every(e => e.aggregate.per90 === null);
      const ranking = usePerMatch ? S.rank(players, key, { minMatches: state.minMatches, view: "perMatch" }) : r;
      return {
        key,
        label: metric.label,
        description: metric.description,
        confidence: metric.confidence,
        formula: S.formula(metric),
        direction: metric.higherIsBetter === null ? "context" : metric.higherIsBetter ? "higher" : "lower",
        unit: metric.type === "ratio" ? "%" : usePerMatch ? "per match" : "per 90",
        minAttempts: metric.minAttempts,
        ranking
      };
    });
  }

  // -------------------------------------------------------------- evolution

  const MAX_EVOLUTION_PERIODS = 52;
  const MIN_MOVER_SAMPLE = 3;

  function evolution(prepared, rows, state, now) {
    const period = state.evolutionPeriod === "month" ? "month" : "week";
    const metricKey = state.evolutionMetric || "pandaScore";
    const present = [...new Set(rows.map(r => {
      const d = S.parseTimestamp(r);
      return d ? S.periodKey(d, period) : null;
    }).filter(Boolean))].sort();
    // Contiguous periods so a week without matches shows as a gap, not as
    // two adjacent points.
    const keys = [];
    if (present.length) {
      let k = present[present.length - 1];
      while (k >= present[0] && keys.length < MAX_EVOLUTION_PERIODS) {
        keys.unshift(k);
        k = S.previousPeriodKey(k, period);
      }
    }

    const players = S.groupByPlayer(rows);
    const valueFor = (pRows) => {
      if (metricKey === "pandaScore") {
        const s = S.pandaScore(pRows, prepared.benchmarks, { minMatches: 1 });
        return { value: s.score, sample: s.scoredAppearances };
      }
      const metric = S.getMetric(metricKey);
      const agg = S.aggregate(pRows, metricKey);
      const value = metric.type === "ratio" ? agg.rate : metric.type === "mean" ? agg.mean
        : agg.per90 !== null ? agg.per90 : agg.perMatch;
      return { value, sample: agg.matchesWithData };
    };

    const inPeriod = (list, key) => {
      const b = S.periodBounds(key, period);
      return list.filter(r => {
        const d = S.parseTimestamp(r);
        return d && d >= b.start && d < b.end;
      });
    };

    const series = players.map(p => ({
      id: p.id,
      name: p.name,
      points: keys.map(k => Object.assign({ period: k }, valueFor(inPeriod(p.rows, k))))
    }));

    const squad = keys.map(k => Object.assign({ period: k, complete: S.isPeriodComplete(k, period, now) },
      valueFor(inPeriod(rows, k))));

    const isRatio = metricKey !== "pandaScore" && S.getMetric(metricKey).type === "ratio";
    // Movers compare completed periods with enough matches; a half-played
    // week or a single match is noise.
    const movers = series.map(s => {
      const pts = s.points.filter(p => p.value !== null && p.sample >= MIN_MOVER_SAMPLE &&
        S.isPeriodComplete(p.period, period, now));
      if (pts.length < 2) return null;
      const last = pts[pts.length - 1];
      const prev = pts[pts.length - 2];
      return { id: s.id, name: s.name, from: prev.period, to: last.period,
               change: last.value - prev.value, unit: isRatio ? "pp" : "",
               samples: [prev.sample, last.sample] };
    }).filter(Boolean).sort((a, b) => b.change - a.change);

    return {
      period,
      metric: metricKey,
      metricLabel: metricKey === "pandaScore" ? "Panda Score" : S.getMetric(metricKey).label,
      keys,
      complete: keys.map(k => S.isPeriodComplete(k, period, now)),
      series,
      squad,
      improvers: movers.filter(m => m.change > 0).slice(0, 3),
      decliners: movers.filter(m => m.change < 0).reverse().slice(0, 3)
    };
  }

  // ----------------------------------------------------------- Weekly Bamboo

  function weeklyBamboo(prepared, state, now) {
    const base = Object.assign({}, state, { period: "all", group: "all" });
    const filters = filtersFor(base, now);
    const rows = S.filterRows(prepared.rows, filters);
    const matches = filteredMatches(prepared, filters);

    // Most recent complete Monday-Sunday week with official matches.
    const current = S.periodKey(now, "week");
    const weeks = [...new Set(matches.map(m => {
      const d = S.parseTimestamp(m);
      return d ? S.periodKey(d, "week") : null;
    }).filter(k => k && k < current))].sort();
    if (!weeks.length) return { week: null };

    const week = weeks[weeks.length - 1];
    const prevWeek = S.previousPeriodKey(week, "week");
    const bounds = S.periodBounds(week, "week");
    const prevBounds = S.periodBounds(prevWeek, "week");
    const within = (list, b) => list.filter(r => {
      const d = S.parseTimestamp(r);
      return d && d >= b.start && d < b.end;
    });

    const weekRows = within(rows, bounds);
    const weekMatches = within(matches, bounds);
    const minMatches = 2;
    const table = scoreTable(prepared, weekRows, minMatches);
    const prevTable = scoreTable(prepared, within(rows, prevBounds), minMatches);

    return {
      week,
      start: bounds.start,
      end: new Date(bounds.end.getTime() - 1),
      matches: weekMatches.length,
      record: {
        wins: weekMatches.filter(m => m.result === "win").length,
        draws: weekMatches.filter(m => m.result === "draw").length,
        losses: weekMatches.filter(m => m.result === "loss").length
      },
      clubs: clubSummaries(prepared, weekMatches),
      awards: awards(prepared, weekRows, table, prevTable),
      minMatches,
      coverage: coverage(weekRows)
    };
  }

  // ----------------------------------------------------------- Panda Lab

  function lab(prepared, rows, playerId, state) {
    const players = S.groupByPlayer(rows);
    const player = players.find(p => p.id === playerId) || players[0];
    if (!player) return null;
    const score = S.pandaScore(player.rows, prepared.benchmarks, { minMatches: state.minMatches });

    const categories = LAB_CATEGORIES.map(cat => ({
      note: cat.note || "",
      key: cat.key,
      label: cat.label,
      metrics: cat.metrics.map(key => {
        const metric = S.getMetric(key);
        const agg = S.aggregate(player.rows, key);
        const q = S.qualify(agg, key, { minMatches: 1 });
        const adj = roleAdjusted(player.rows, prepared.rows, key);
        return {
          key,
          label: metric.label,
          description: metric.description,
          confidence: metric.confidence,
          type: metric.type,
          direction: metric.higherIsBetter,
          total: agg.total,
          perMatch: agg.perMatch,
          per90: agg.per90,
          rate: agg.rate,
          numerator: agg.numerator,
          denominator: agg.denominator,
          coverage: metricCoverage(agg),
          status: q.status,
          reasons: q.reasons,
          peer: adj ? adj.expected : null
        };
      })
    }));

    const dirs = ["Forward", "Backward", "Sideways"].map(d => {
      const completed = S.aggregate(player.rows, "forwardPassesCompleted"); // coverage reference
      const rowsWithEvents = player.rows.filter(r => S.isAppearance(r) && S.eventsUsable(r));
      const c = sum(rowsWithEvents.map(r => S.toNumber(r["passesCompleted" + d]) || 0));
      const f = sum(rowsWithEvents.map(r => S.toNumber(r["passesFailed" + d]) || 0));
      return { direction: d, completed: c, failed: f, attempts: c + f, matches: completed.matchesWithData };
    });
    const known = sum(dirs.map(d => d.attempts));
    dirs.forEach(d => {
      d.share = known ? d.attempts / known * 100 : null;
      d.accuracy = d.attempts ? d.completed / d.attempts * 100 : null;
    });

    const groups = {};
    player.rows.filter(S.isAppearance).forEach(r => {
      const g = S.positionGroup(r) || "Unknown";
      groups[g] = (groups[g] || 0) + 1;
    });

    return {
      id: player.id,
      name: player.name,
      players: players.map(p => ({ id: p.id, name: p.name })).sort((a, b) => a.name.localeCompare(b.name)),
      score,
      rating: S.aggregate(player.rows, "rating"),
      groups,
      coverage: coverage(player.rows),
      categories,
      passingDna: dirs,
      tips: coachingTips(score, prepared.benchmarks, player.rows)
    };
  }

  // -------------------------------------------------------- Squad & Builds

  function squad(prepared, rows, state) {
    return scoreTable(prepared, rows, state.minMatches).map(t => {
      const archetypes = {};
      t.rows.filter(S.isAppearance).forEach(r => {
        if (r.archetypeId) archetypes[r.archetypeId] = (archetypes[r.archetypeId] || 0) + 1;
      });
      const topArch = Object.entries(archetypes).sort((a, b) => b[1] - a[1])[0];
      const best = Object.entries(t.byGroup)
        .map(([g, v]) => ({ group: g, label: S.GROUP_LABELS[g], score: v.score, appearances: v.appearances,
                            tentative: v.appearances < 5 }))
        .sort((a, b) => b.score - a.score);
      return {
        id: t.id,
        name: t.name,
        score: t.score,
        status: t.status,
        appearances: t.appearances,
        groups: best,
        bestGroup: best[0] || null,
        goals: S.aggregate(t.rows, "goals").total,
        assists: S.aggregate(t.rows, "assists").total,
        rating: S.aggregate(t.rows, "rating").mean,
        archetype: topArch ? { id: topArch[0], appearances: topArch[1] } : null,
        strengths: t.strengths
      };
    }).sort((a, b) => (b.score === null ? -1 : b.score) - (a.score === null ? -1 : a.score));
  }

  // ------------------------------------------------------------------ build

  function build(prepared, state, now, selectedPlayer) {
    const st = Object.assign({}, DEFAULT_STATE, state);
    const filters = filtersFor(st, now);
    const rows = S.filterRows(prepared.rows, filters);
    const matches = filteredMatches(prepared, Object.assign({}, filters, { groups: null }));
    const players = S.groupByPlayer(rows);
    const table = scoreTable(prepared, rows, st.minMatches);

    // Previous period for Most Improved / Biggest Decline.
    let previousTable = null;
    const range = periodRange(st.period, now);
    if (range.key) {
      const period = st.period.endsWith("Month") ? "month" : "week";
      const pb = S.periodBounds(S.previousPeriodKey(range.key, period), period);
      const prevRows = S.filterRows(prepared.rows, Object.assign({}, filters, { from: pb.start, to: pb.end }));
      previousTable = scoreTable(prepared, prevRows, st.minMatches);
    }

    return {
      state: st,
      filters,
      overview: {
        clubs: clubSummaries(prepared, matches),
        matches: matches.length,
        recent: matches.slice(0, 8),
        coverage: coverage(rows),
        sync: prepared.sync,
        generatedAt: prepared.generatedAt,
        duplicatesDropped: prepared.duplicatesDropped,
        bamboo: weeklyBamboo(prepared, st, now)
      },
      rankings: {
        scores: rankScores(table),
        categories: DISPLAY_CATEGORIES.map(c => ({ key: c.key, label: c.label })),
        categoryRankings: cat => categoryRankings(players, DISPLAY_CATEGORIES.find(c => c.key === cat) || DISPLAY_CATEGORIES[0], st)
      },
      evolution: evolution(prepared, rows, st, now),
      lab: lab(prepared, rows, selectedPlayer, st),
      squad: squad(prepared, rows, st),
      awards: awards(prepared, rows, table, previousTable)
    };
  }

  return {
    DISPLAY_CATEGORIES,
    LAB_CATEGORIES,
    PERIODS,
    MATCH_TYPES,
    DEFAULT_STATE,
    TIPS,
    periodRange,
    filtersFor,
    prepare,
    coverage,
    roleAdjusted,
    awards,
    coachingTips,
    evolution,
    weeklyBamboo,
    lab,
    squad,
    scoreTable,
    rankScores,
    categoryRankings,
    build
  };
})();

// ==========================================
// PANDAMETRICS V4 - DASHBOARD UI
// ==========================================
//
// Rendering only: all numbers come from PandaInsights / PandaStats.
// Every interpolated string goes through esc().

(function () {
  "use strict";

  const S = PandaStats;
  const I = PandaInsights;

  const VIEWS = [
    ["overview", "🐼 Panda Den"],
    ["rankings", "🏆 Rankings"],
    ["evolution", "📈 Evolution"],
    ["lab", "🔬 Panda Lab"],
    ["squad", "🃏 Squad & Builds"],
    ["awards", "🌟 Awards"]
  ];

  const EVOLUTION_METRICS = [
    "pandaScore", "passAccuracy", "forwardPassesCompleted", "goals", "assists",
    "shotAccuracy", "interceptions", "tackleSuccess", "possessionLost", "goodDecisionShare"
  ];

  const state = Object.assign({}, I.DEFAULT_STATE, {
    view: "overview",
    category: "passing",
    player: null,
    evoMode: window.matchMedia && window.matchMedia("(max-width: 700px)").matches ? "mini" : "squad",
    awardsScope: "week"
  });

  let prepared = null;
  let model = null;
  let loadedAt = null;

  const $ = id => document.getElementById(id);

  // ------------------------------------------------------------- helpers

  function esc(value) {
    return String(value === null || value === undefined ? "" : value).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function num(v, d) {
    return v === null || v === undefined || !Number.isFinite(v) ? "—" : v.toFixed(d === undefined ? 1 : d);
  }

  function signed(v, d, unit) {
    if (v === null || !Number.isFinite(v)) return "—";
    return (v > 0 ? "+" : "") + v.toFixed(d) + (unit || "");
  }

  function dateLabel(value, withTime) {
    if (!value) return "—";
    const d = value instanceof Date ? value : new Date(value);
    if (isNaN(d)) return "—";
    const opts = { timeZone: "Europe/London", day: "numeric", month: "short" };
    if (withTime) Object.assign(opts, { hour: "2-digit", minute: "2-digit" });
    return d.toLocaleString("en-GB", opts);
  }

  function badge(confidence) {
    if (confidence === "experimental") return '<span class="badge exp" title="Unverified mapping; not used in scores">Experimental</span>';
    if (confidence === "medium") return '<span class="badge med" title="Derived or caveated metric">Caveat</span>';
    return "";
  }

  function coverageChip(withData, appearances) {
    if (!appearances) return "";
    const pct = withData / appearances * 100;
    const cls = pct >= 95 ? "ok" : pct >= 75 ? "warn" : "bad";
    return `<span class="chip cov ${cls}" title="Matches with this data / appearances">${withData}/${appearances} matches</span>`;
  }

  function groupChips(byGroup) {
    return Object.entries(byGroup || {})
      .sort((a, b) => b[1].appearances - a[1].appearances)
      .map(([g, v]) => `<span class="chip grp ${esc(g)}">${esc(g)} ${num(v.score, 0)} <small>(${v.appearances})</small></span>`)
      .join("");
  }

  function formChips(form) {
    return form.map(r => `<span class="form ${esc(r)}">${esc((r || "?")[0].toUpperCase())}</span>`).join("");
  }

  function bar(pct) {
    const w = Math.max(0, Math.min(100, pct || 0));
    return `<div class="bar"><div class="fill" style="width:${w.toFixed(1)}%"></div></div>`;
  }

  function empty(text) {
    return `<div class="panel empty">${esc(text)}</div>`;
  }

  // -------------------------------------------------------------- charts

  const PALETTE = ["#baff83", "#62d69e", "#ffd76a", "#7cc8ff", "#ff9685", "#c79bff", "#ffb35c", "#9be7e0", "#f0f8f1", "#a7bcae"];

  function lineChart(seriesList, keys, complete, opts) {
    const o = Object.assign({ width: 640, height: 220, pad: 28, min: null, max: null }, opts);
    const values = seriesList.flatMap(s => s.points.map(p => p.value)).filter(v => v !== null && Number.isFinite(v));
    if (!values.length || keys.length < 1) return '<div class="muted">Not enough data for a chart yet.</div>';
    const lo = o.min !== null ? o.min : Math.min(...values);
    const hi = o.max !== null ? o.max : Math.max(...values);
    const span = hi - lo || 1;
    const x = i => o.pad + (keys.length === 1 ? (o.width - 2 * o.pad) / 2 : i * (o.width - 2 * o.pad) / (keys.length - 1));
    const y = v => o.height - o.pad - (v - lo) / span * (o.height - 2 * o.pad);

    const lines = seriesList.map((s, si) => {
      const color = s.color || PALETTE[si % PALETTE.length];
      let path = "";
      let open = false;
      const dots = [];
      s.points.forEach((p, i) => {
        if (p.value === null || !Number.isFinite(p.value)) {
          open = false;
          return;
        }
        path += (open ? "L" : "M") + x(i).toFixed(1) + "," + y(p.value).toFixed(1);
        open = true;
        const hollow = complete && complete[i] === false;
        dots.push(`<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="${o.dot || 3.5}" fill="${hollow ? "none" : color}" stroke="${color}" stroke-width="1.5"><title>${esc(s.name)} · ${esc(keys[i])}: ${num(p.value)}${p.sample !== undefined ? " (" + p.sample + " matches)" : ""}${hollow ? " · in progress" : ""}</title></circle>`);
      });
      return `<path d="${path}" fill="none" stroke="${color}" stroke-width="${o.stroke || 2}" stroke-linejoin="round"/>${dots.join("")}`;
    }).join("");

    const axis = o.axis === false ? "" : `
      <text x="4" y="${y(hi) + 4}" class="axis">${num(hi, 0)}</text>
      <text x="4" y="${y(lo) + 4}" class="axis">${num(lo, 0)}</text>
      ${keys.map((k, i) => (keys.length <= 8 || i % Math.ceil(keys.length / 8) === 0)
        ? `<text x="${x(i)}" y="${o.height - 6}" class="axis" text-anchor="middle">${esc(k.slice(5))}</text>` : "").join("")}`;

    return `<svg viewBox="0 0 ${o.width} ${o.height}" class="chart" role="img" aria-label="${esc(o.label || "trend chart")}">${axis}${lines}</svg>`;
  }

  function legend(seriesList) {
    return `<div class="legend">${seriesList.map((s, i) =>
      `<span><i style="background:${s.color || PALETTE[i % PALETTE.length]}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  }

  // ------------------------------------------------------------- filters

  function renderFilters() {
    const clubs = Object.entries(prepared.clubs);
    const opt = (value, label, current) => `<option value="${esc(value)}" ${String(value) === String(current) ? "selected" : ""}>${esc(label)}</option>`;
    $("filters").innerHTML = `
      <label>Club<select data-filter="club">${opt("all", "All clubs", state.club)}${clubs.map(([id, name]) => opt(id, name, state.club)).join("")}</select></label>
      <label>Period<select data-filter="period">${I.PERIODS.map(p => opt(p.key, p.label, state.period)).join("")}</select></label>
      <label>Matches<select data-filter="matchType">${I.MATCH_TYPES.map(t => opt(t.key, t.label, state.matchType)).join("")}</select></label>
      <label>Position<select data-filter="group">${opt("all", "All positions", state.group)}${S.GROUPS.filter(g => g !== "GK").map(g => opt(g, S.GROUP_LABELS[g] + "s", state.group)).join("")}</select></label>
      <label>Min. matches<select data-filter="minMatches">${[1, 3, 5, 10].map(n => opt(n, n + (n === 1 ? " match" : " matches"), state.minMatches)).join("")}</select></label>`;
    document.querySelectorAll("[data-filter]").forEach(el => {
      el.onchange = () => {
        const key = el.dataset.filter;
        state[key] = key === "minMatches" ? Number(el.value) : el.value;
        render();
      };
    });
  }

  function renderNav() {
    $("nav").innerHTML = VIEWS.map(([key, label]) =>
      `<button data-view="${key}" class="${state.view === key ? "active" : ""}">${esc(label)}</button>`).join("");
    document.querySelectorAll("[data-view]").forEach(b => {
      b.onclick = () => {
        state.view = b.dataset.view;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    });
  }

  // ------------------------------------------------------------- overview

  function renderOverview() {
    const o = model.overview;
    const cov = o.coverage;
    const sync = o.sync || {};
    const bamboo = o.bamboo;

    const clubCards = Object.values(o.clubs).filter(c => c.played).map(c => `
      <div class="panel club">
        <h3>${esc(c.name)}</h3>
        <div class="record"><b>${c.wins}</b>W <b>${c.draws}</b>D <b>${c.losses}</b>L</div>
        <div class="muted">${c.goalsFor}–${c.goalsAgainst} goals · ${c.played} matches${c.playoffs ? " · " + c.playoffs + " playoff" : ""}</div>
        <div class="forms">${formChips(c.form)}</div>
      </div>`).join("") || empty("No official matches in this filter.");

    const highlight = key => {
      if (!bamboo.week) return null;
      return bamboo.awards.hall.concat(bamboo.awards.shame).find(a => a.key === key);
    };
    const hl = ["pandaOfWeek", "goldenBoot", "shotgunTarget"].map(highlight).filter(Boolean).map(a => `
      <div class="mini-award ${a.shame ? "shame" : ""}">
        <div class="muted">${esc(a.title)}</div>
        <div class="name">${a.winner ? esc(a.winner.name) : "—"}</div>
        <div class="muted">${a.value ? esc(a.value) : "No eligible player"}</div>
      </div>`).join("");

    const recent = o.recent.map(m => `
      <div class="match-row">
        <span class="form ${esc(m.result)}">${esc((m.result || "?")[0].toUpperCase())}</span>
        <span class="grow">${esc(prepared.clubs[m.clubId] || m.clubId)} <span class="muted">vs</span> ${esc(m.opponentName)}</span>
        <b>${m.goals}–${m.goalsAgainst}</b>
        <span class="muted small">${dateLabel(m.timestampUnix * 1000)}${m.matchType === "playoffMatch" ? " · Playoff" : ""}</span>
      </div>`).join("");

    $("overview").innerHTML = `
      <div class="grid stats">
        <div class="panel"><div class="stat">${o.matches}</div><div class="muted">Official matches</div></div>
        <div class="panel"><div class="stat">${cov.appearances}</div><div class="muted">Player appearances</div></div>
        <div class="panel"><div class="stat">${num(cov.eventCoveragePct, 0)}%</div><div class="muted">Detailed event coverage</div></div>
        <div class="panel"><div class="stat small-stat">${dateLabel(sync.lastSync, true)}</div><div class="muted">Last successful sync</div></div>
      </div>

      <div class="panel bamboo">
        <div class="eyebrow">🎋 WEEKLY BAMBOO</div>
        ${bamboo.week ? `
          <h2>Week of ${dateLabel(bamboo.start)} – ${dateLabel(bamboo.end)}</h2>
          <p>${bamboo.matches} official matches · ${bamboo.record.wins}W ${bamboo.record.draws}D ${bamboo.record.losses}L · awards need ${bamboo.minMatches}+ matches that week</p>
          <div class="mini-awards">${hl}</div>
          <button class="link" data-goto="awards">See every weekly award →</button>
        ` : "<p>No complete week with official matches yet.</p>"}
      </div>

      <h2>Clubs</h2>
      <div class="grid">${clubCards}</div>

      <div class="panel">
        <h3>Data coverage</h3>
        <p class="small">${cov.withEvents} of ${cov.appearances} appearances have complete event data. ${cov.eventsUnavailable} use EA's named totals only (goals, passes, tackles) because their event data was missing or cut short; event-based stats skip those matches rather than counting zero. ${cov.didNotPlay} zero-minute entries are excluded from every participation count.${o.duplicatesDropped ? " " + o.duplicatesDropped + " duplicate rows ignored." : ""}</p>
        <div class="chips">${Object.entries(cov.groups).map(([g, n]) => `<span class="chip grp ${esc(g)}">${esc(S.GROUP_LABELS[g] || g)} · ${n}</span>`).join("")}</div>
      </div>

      <div class="panel">
        <h3>Recent matches</h3>
        ${recent || '<div class="muted">No matches.</div>'}
      </div>`;
  }

  // ------------------------------------------------------------- rankings

  function scoreRow(t, rank) {
    return `
      <div class="rank-row">
        <div class="rank-number">${rank === null ? "–" : rank}</div>
        <div class="grow">
          <button class="name-link" data-player="${esc(t.id)}">${esc(t.name)}</button>
          <div class="chips">${groupChips(t.byGroup)}</div>
        </div>
        <div class="score-col">${bar(t.score)}<div class="muted small">${t.scoredAppearances} scored / ${t.appearances} played</div></div>
        <div class="value">${num(t.score, 0)}</div>
      </div>`;
  }

  function metricValue(entry, rk) {
    const a = entry.aggregate;
    if (rk.unit === "%") return { main: num(entry.value) + "%", detail: `${a.numerator}/${a.denominator}` };
    if (rk.unit === "per 90") return { main: num(entry.value, 2), detail: `${a.total} total · ${num(a.perMatch, 2)}/match` };
    return { main: num(entry.value, 2), detail: `${a.total} total` };
  }

  function metricPanel(rk) {
    const r = rk.ranking;
    const all = r.ranked.concat(r.provisional);
    const max = Math.max(0.0001, ...all.map(e => Math.abs(e.value || 0)));
    const rows = r.ranked.map(e => {
      const v = metricValue(e, rk);
      return `<div class="rank-row compact">
        <div class="rank-number">${r.contextOnly ? "·" : e.rank}</div>
        <div class="grow"><span class="rank-name">${esc(e.name)}</span> ${coverageChip(e.aggregate.matchesWithData, e.aggregate.appearances)}</div>
        <div class="score-col">${bar(Math.abs(e.value) / max * 100)}<div class="muted small">${esc(v.detail)}</div></div>
        <div class="value">${esc(v.main)}</div>
      </div>`;
    }).join("");
    const prov = r.provisional.length ? `
      <details><summary>${r.provisional.length} provisional (not ranked)</summary>
        ${r.provisional.map(e => `<div class="prov"><b>${esc(e.name)}</b> ${esc(metricValue(e, rk).main)} · <span class="muted">${esc(e.reasons.join(", "))}</span></div>`).join("")}
      </details>` : "";
    const direction = rk.direction === "context"
      ? "Context only: not better or worse on its own. Compare with positional peers."
      : rk.direction === "higher" ? "Higher is better." : "Lower is better.";
    return `
      <div class="panel">
        <h3>${esc(rk.label)} ${badge(rk.confidence)} <span class="unit">${esc(rk.unit)}</span></h3>
        <p class="small">${esc(rk.description)} ${esc(direction)}${rk.minAttempts ? " Needs " + rk.minAttempts + "+ attempts." : ""}</p>
        <details class="formula"><summary>Formula</summary><code>${esc(rk.formula)}</code></details>
        ${rows || '<div class="muted">No qualified players yet.</div>'}
        ${prov}
      </div>`;
  }

  function scoreExplainer() {
    const rows = Object.entries(S.ROLE_WEIGHTS).map(([g, w]) =>
      `<tr><th>${esc(S.GROUP_LABELS[g])}</th><td>${Object.entries(w).map(([k, v]) => esc(S.getMetric(k).label) + " ×" + v).join(", ")}</td></tr>`).join("");
    return `<details class="panel"><summary><b>How the Panda Score works</b></summary>
      <p class="small">Every match is scored against other appearances in the same position group (attacker, midfielder or defender as reported by EA for that match). Each component becomes a percentile (50 = typical), then a weighted average. A player's score is the average of their match scores, so switching positions never counts against them. EA match rating is not used.</p>
      <table class="weights">${rows}</table></details>`;
  }

  function renderRankings() {
    const rk = model.rankings;
    const groupNote = state.group === "all" ? "" : ` Showing ${S.GROUP_LABELS[state.group].toLowerCase()} appearances only.`;
    const scored = rk.scores.qualified.map(t => scoreRow(t, t.rank)).join("");
    const provisional = rk.scores.provisional.map(t => scoreRow(t, null)).join("");
    const catButtons = rk.categories.map(c =>
      `<button data-category="${esc(c.key)}" class="${state.category === c.key ? "active" : ""}">${esc(c.label)}</button>`).join("");

    $("rankings").innerHTML = `
      <h2>🏆 Panda Score standings</h2>
      <p>Position-adjusted overall performance.${esc(groupNote)} Qualified players have ${state.minMatches}+ scored matches.</p>
      ${scoreExplainer()}
      <div class="panel">${scored || '<div class="muted">No qualified players. Lower the minimum matches.</div>'}</div>
      ${provisional ? `<details class="panel"><summary>${rk.scores.provisional.length} provisional players</summary>${provisional}</details>` : ""}
      <h2>Category leaderboards</h2>
      <div class="buttons scroll">${catButtons}</div>
      ${rk.categoryRankings(state.category).map(metricPanel).join("")}`;
  }

  // ------------------------------------------------------------ evolution

  function renderEvolution() {
    const e = model.evolution;
    const opt = (v, l, c) => `<option value="${esc(v)}" ${v === c ? "selected" : ""}>${esc(l)}</option>`;
    const metricOptions = EVOLUTION_METRICS.map(k => opt(k, k === "pandaScore" ? "Panda Score" : S.getMetric(k).label, state.evolutionMetric)).join("");
    const unit = e.metric !== "pandaScore" && S.getMetric(e.metric).type === "ratio" ? " pp" : "";
    const scale = e.metric === "pandaScore" ? { min: 0, max: 100 } : {};

    const movers = (list, title) => `<div class="panel"><h3>${esc(title)}</h3>${list.length ? list.map(m =>
      `<div class="mover"><b>${esc(m.name)}</b><span class="${m.change > 0 ? "up" : "down"}">${signed(m.change, 1, unit)}</span><span class="muted small">${esc(m.from)} → ${esc(m.to)} (${m.samples[0]} → ${m.samples[1]} matches)</span></div>`).join("")
      : '<div class="muted">Needs two completed periods with 3+ matches each.</div>'}</div>`;

    const active = e.series.filter(s => s.points.some(p => p.value !== null));
    const charts = state.evoMode === "squad"
      ? `<div class="panel">${lineChart(active, e.keys, e.complete, Object.assign({ label: e.metricLabel + " by player" }, scale))}${legend(active)}</div>`
      : `<div class="grid minis">${active.map(s => {
          const last = s.points.filter(p => p.value !== null).slice(-1)[0];
          return `<div class="panel mini"><div class="mini-head"><b>${esc(s.name)}</b><span>${num(last ? last.value : null)}</span></div>
            ${lineChart([s], e.keys, e.complete, Object.assign({ width: 300, height: 90, pad: 10, axis: false, dot: 3, label: s.name }, scale))}
            <div class="muted small">${s.points.reduce((a, p) => a + (p.sample || 0), 0)} matches</div></div>`;
        }).join("")}</div>`;

    $("evolution").innerHTML = `
      <h2>📈 Panda Evolution</h2>
      <p>How performance changes over ${e.period === "week" ? "Monday–Sunday weeks" : "calendar months"} (Europe/London). Hollow points are periods still in progress. Accuracy changes are in percentage points.</p>
      <div class="filters inline">
        <label>Period<select id="evoPeriod">${opt("week", "Weekly", state.evolutionPeriod)}${opt("month", "Monthly", state.evolutionPeriod)}</select></label>
        <label>Metric<select id="evoMetric">${metricOptions}</select></label>
        <label>View<select id="evoMode">${opt("mini", "One chart per player", state.evoMode)}${opt("squad", "Squad comparison", state.evoMode)}</select></label>
      </div>
      <div class="panel"><h3>Squad ${esc(e.metricLabel)}</h3>
        ${lineChart([{ name: "Squad", points: e.squad, color: "#ffd76a" }], e.keys, e.complete, Object.assign({ label: "Squad trend" }, scale))}
        <div class="muted small">${e.squad.map(p => esc(p.period.slice(5)) + ": " + (p.sample || 0)).join(" · ")} matches</div>
      </div>
      <div class="grid two">${movers(e.improvers, "📈 Improving")}${movers(e.decliners, "📉 Declining")}</div>
      ${charts}`;

    $("evoPeriod").onchange = ev => { state.evolutionPeriod = ev.target.value; render(); };
    $("evoMetric").onchange = ev => { state.evolutionMetric = ev.target.value; render(); };
    $("evoMode").onchange = ev => { state.evoMode = ev.target.value; render(); };
  }

  // ------------------------------------------------------------------ lab

  function labMetric(m) {
    let main;
    let detail;
    if (m.type === "ratio") {
      main = m.rate === null ? "—" : num(m.rate) + "%";
      detail = m.denominator ? `${m.numerator} of ${m.denominator}` : "No attempts";
    } else {
      main = m.per90 !== null ? num(m.per90, 2) : num(m.perMatch, 2);
      detail = `${m.total === null ? "—" : m.total} total · ${num(m.perMatch, 2)}/match${m.per90 !== null ? " · per 90 shown" : ""}`;
    }
    const peer = m.peer === null ? "" : `<div class="peer">Typical for your positions: ${m.type === "ratio" ? num(m.peer) + "%" : num(m.peer, 2)}</div>`;
    return `<div class="metric-card ${m.status === "provisional" ? "provisional" : ""}">
      <div class="metric-label">${esc(m.label)} ${badge(m.confidence)}</div>
      <div class="metric-value">${esc(main)}</div>
      <div class="metric-detail">${esc(m.description)}</div>
      <div class="metric-detail">${esc(detail)}</div>
      ${peer}
      <div class="metric-detail">${coverageChip(m.coverage.withData, m.coverage.appearances)}${m.status === "provisional" ? ' <span class="chip">Provisional</span>' : ""}</div>
    </div>`;
  }

  function renderLab() {
    const l = model.lab;
    if (!l) {
      $("lab").innerHTML = empty("No player data for these filters.");
      return;
    }
    state.player = l.id;
    const sc = l.score;
    const options = l.players.map(p => `<option value="${esc(p.id)}" ${p.id === l.id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
    const list = (items, cls) => items.length ? items.map(x => `<span class="chip ${cls}">${esc(x.label)} · ${num(x.percentile, 0)}th pct</span>`).join("") : '<span class="muted">Not enough data</span>';
    const dna = l.passingDna.map(d => `
      <div class="direction-row">
        <div class="direction-label"><b>${esc(d.direction)}</b><span>${d.attempts} attempts · ${d.accuracy === null ? "—" : num(d.accuracy) + "% completed"} · ${num(d.share, 0)}% of passes</span></div>
        ${bar(d.share)}
      </div>`).join("");
    const tips = l.tips.length ? l.tips.map(t => `<div class="note"><b>${esc(t.title)}</b><br>${esc(t.tip)}<div class="muted small">${esc(t.evidence)}</div></div>`).join("")
      : '<div class="note">No clear weaknesses against positional peers in this filter. Keep it up.</div>';

    $("lab").innerHTML = `
      <h2>🔬 Panda Lab</h2>
      <div class="panel"><label>Player<select id="labPlayer">${options}</select></label></div>
      <div class="profile">
        <div class="profile-top">
          <div><div class="profile-rating">${num(sc.score, 0)}</div><div class="muted">Panda Score${sc.status === "provisional" ? " · provisional" : ""}</div></div>
          <div class="right"><div class="muted">EA rating (reference)</div><b>${num(l.rating.mean, 2)}</b></div>
        </div>
        <h2>🐼 ${esc(l.name)}</h2>
        <div class="chips">${groupChips(sc.byGroup)}</div>
        <p class="small">${l.coverage.appearances} appearances · ${l.coverage.withEvents} with full event data${l.coverage.didNotPlay ? " · " + l.coverage.didNotPlay + " zero-minute entries excluded" : ""}</p>
      </div>
      <div class="grid two">
        <div class="panel"><h3>💪 Strengths vs positional peers</h3><div class="chips">${list(sc.strengths, "good")}</div></div>
        <div class="panel"><h3>🛠️ To work on</h3><div class="chips">${list(sc.weaknesses, "bad")}</div></div>
      </div>
      <div class="panel"><h3>🎓 Personal coaching</h3>${tips}</div>
      <div class="panel"><h3>🧬 Passing DNA</h3><p class="small">Share and completion of passes with a recorded direction. Failed-pass directions are under-recorded by EA, so completion here reads slightly high.</p>${dna}</div>
      ${l.categories.map(c => `<div class="panel"><h3>${esc(c.label)}</h3>${c.note ? `<p class="small">${esc(c.note)}</p>` : ""}<div class="metric-grid">${c.metrics.map(labMetric).join("")}</div></div>`).join("")}`;

    $("labPlayer").onchange = ev => { state.player = ev.target.value; render(); };
  }

  // ---------------------------------------------------------------- squad

  function renderSquad() {
    const cards = model.squad.map(p => `
      <div class="card">
        <div class="card-top"><div class="card-score">${num(p.score, 0)}</div><div class="card-pos">${p.bestGroup ? esc(p.bestGroup.group) : "—"}</div></div>
        <div class="card-name">${esc(p.name)}</div>
        <div class="card-stats">
          <span><b>${p.appearances}</b>Apps</span><span><b>${p.goals === null ? "—" : p.goals}</b>Goals</span>
          <span><b>${p.assists === null ? "—" : p.assists}</b>Assists</span><span><b>${num(p.rating, 1)}</b>EA avg</span>
        </div>
        <div class="finder">
          <div class="muted small">Best Position Finder</div>
          ${p.groups.map(g => `<div class="finder-row"><span>${esc(g.label)}</span>${bar(g.score)}<b>${num(g.score, 0)}</b><span class="muted small">${g.appearances} apps${g.tentative ? " · tentative" : ""}</span></div>`).join("") || '<div class="muted small">No scored matches</div>'}
        </div>
        <div class="muted small">${p.archetype ? "Most used archetype: #" + esc(p.archetype.id) + " (" + p.archetype.appearances + " apps) — EA doesn't publish archetype names" : "Archetype unknown"}</div>
      </div>`).join("");
    $("squad").innerHTML = `
      <h2>🃏 Squad & Builds</h2>
      <p>Cards use match performance. EA's API reports only the position group (attacker, midfielder, defender) for each match, so the Best Position Finder compares groups, not exact positions. Fewer than 5 matches in a group is tentative. Build attributes, PlayStyles and portraits aren't available from EA.</p>
      <div class="grid cards">${cards || empty("No players for these filters.")}</div>`;
  }

  // --------------------------------------------------------------- awards

  function awardCard(a) {
    return `<div class="award ${a.shame ? "shame" : ""}">
      <div class="award-title">${esc(a.title)}</div>
      <div class="award-player">${a.winner ? esc(a.winner.name) : "No eligible winner"}</div>
      <div class="award-number">${a.value ? esc(a.value) : "—"}</div>
      <div class="award-description">${esc(a.description)}</div>
      <div class="award-footer">${a.shame && a.advice ? "Redemption plan: " + esc(a.advice) : ""}${a.sample ? `<br><span class="muted">${esc(a.sample)}</span>` : ""}</div>
    </div>`;
  }

  function renderAwards() {
    const week = model.overview.bamboo;
    const useWeek = state.awardsScope === "week" && week.week;
    const set = useWeek ? week.awards : model.awards;
    const scopeLabel = useWeek
      ? `Weekly Bamboo: ${dateLabel(week.start)} – ${dateLabel(week.end)} (${week.minMatches}+ matches to qualify)`
      : `Current filters (${state.minMatches}+ scored matches to qualify)`;
    $("awards").innerHTML = `
      <h2>🌟 Awards</h2>
      <div class="buttons">
        <button data-scope="week" class="${state.awardsScope === "week" ? "active" : ""}">🎋 Weekly Bamboo</button>
        <button data-scope="filters" class="${state.awardsScope === "filters" ? "active" : ""}">🔎 Current filters</button>
      </div>
      <p>${esc(scopeLabel)} · ${set.eligible} eligible players. Awards compare players with others in the same positions where it matters.</p>
      <h3>🏛️ Hall of Pandas</h3>
      <div class="award-grid">${set.hall.map(awardCard).join("")}</div>
      <h3>💀 Wall of Shame</h3>
      <div class="award-grid">${set.shame.map(awardCard).join("")}</div>`;
    document.querySelectorAll("[data-scope]").forEach(b => {
      b.onclick = () => { state.awardsScope = b.dataset.scope; render(); };
    });
  }

  // ----------------------------------------------------------------- main

  function render() {
    model = I.build(prepared, state, new Date(), state.player);
    renderNav();
    renderFilters();
    const renderers = { overview: renderOverview, rankings: renderRankings, evolution: renderEvolution,
                        lab: renderLab, squad: renderSquad, awards: renderAwards };
    VIEWS.forEach(([key]) => $(key).classList.toggle("hidden", key !== state.view));
    renderers[state.view]();

    document.querySelectorAll("[data-category]").forEach(b => {
      b.onclick = () => { state.category = b.dataset.category; render(); };
    });
    document.querySelectorAll("[data-player]").forEach(b => {
      b.onclick = () => { state.player = b.dataset.player; state.view = "lab"; render(); };
    });
    document.querySelectorAll("[data-goto]").forEach(b => {
      b.onclick = () => { state.view = b.dataset.goto; render(); };
    });
    $("updated").textContent = loadedAt ? "Data loaded " + dateLabel(loadedAt, true) : "";
  }

  function load() {
    $("refresh").disabled = true;
    $("loading").classList.remove("hidden");
    google.script.run
      .withSuccessHandler(data => {
        $("refresh").disabled = false;
        if (!data || !data.ok) {
          $("loading").textContent = (data && data.message) || "No data returned.";
          return;
        }
        prepared = I.prepare(data);
        loadedAt = new Date();
        $("loading").classList.add("hidden");
        $("app").classList.remove("hidden");
        render();
      })
      .withFailureHandler(() => {
        $("refresh").disabled = false;
        $("loading").textContent = "Unable to load PandaMetrics right now. Please try again.";
      })
      .getDashboardData();
  }

  $("refresh").onclick = load;
  load();
})();
</script>
